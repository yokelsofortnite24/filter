:root{
  --cream:#F6F0E4; --cream-2:#FBF7EF; --card:#FFFDF9;
  --coffee-900:#2A180F; --coffee-700:#4A3020; --coffee-500:#6B4A34;
  --caramel:#B5713D; --caramel-dark:#8F5629; --caramel-light:#E3B583;
  --sage:#77875F; --line:#E6D9C2; --danger:#B34B3C; --shadow:0 10px 30px -12px rgba(42,24,15,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--coffee-900);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Fraunces',serif}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--caramel-light)}
.scrim{position:fixed;inset:0;background:rgba(42,24,15,.45);backdrop-filter:blur(2px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--cream-2);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:24px;box-shadow:var(--shadow);animation:up .28s ease}
@media(min-width:640px){.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet.no-anim{animation:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--coffee-900);color:var(--cream-2)}
.btn-primary:hover{background:var(--caramel-dark)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1.5px solid var(--coffee-900);color:var(--coffee-900)}
.btn-ghost{background:var(--line);color:var(--coffee-700)}
.btn-danger{background:var(--danger);color:#fff}
.input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px;color:var(--coffee-900)}
.input:focus{outline:none;border-color:var(--caramel)}
.chip{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--coffee-700);white-space:nowrap}
.chip.active{background:var(--coffee-900);color:var(--cream-2);border-color:var(--coffee-900)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.badge.pending{background:#EDE0C8;color:#8F5629}
.badge.accepted{background:#DCE6D2;color:#4C6B3B}
.badge.preparing{background:#F3D9B1;color:#8F5629}
.badge.ready{background:#CFE7DC;color:#2E6E52}
.badge.completed{background:#D9D2C4;color:#4A3020}
.badge.cancelled{background:#EFD3CD;color:#B34B3C}
.spinner{width:18px;height:18px;border:2.5px solid var(--caramel-light);border-top-color:var(--caramel-dark);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabbar{position:sticky;bottom:0;background:var(--cream-2);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:30}
.tabbtn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--coffee-500);font-size:10px;font-weight:700;padding:4px 10px;border-radius:12px}
.tabbtn.active{color:var(--caramel-dark)}
.topbar{position:sticky;top:0;background:rgba(246,240,228,.92);backdrop-filter:blur(8px);z-index:20;padding:16px 18px;border-bottom:1px solid var(--line)}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.scrollx::-webkit-scrollbar{display:none}
.fade-in{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--coffee-900);color:var(--cream-2);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:100;box-shadow:var(--shadow);animation:fadein .2s ease}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--coffee-900);color:var(--cream-2)}
.progress-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--caramel),var(--caramel-dark));transition:width .5s ease}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.link{color:var(--caramel-dark);font-weight:600;text-decoration:underline;cursor:pointer;background:none;border:none;font-size:inherit;font-family:inherit}
label.small{font-size:12px;font-weight:700;color:var(--coffee-500);text-transform:uppercase;letter-spacing:.04em}
.btn{transition:.16s cubic-bezier(.4,0,.2,1)}
.btn:active{transform:scale(.96)}
.card{transition:box-shadow .2s ease, transform .2s ease}
@media(hover:hover){.card.hoverable:hover{transform:translateY(-2px);box-shadow:0 16px 34px -14px rgba(42,24,15,.26)}}
.topbar{transition:box-shadow .2s}
#loadbar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--caramel),var(--caramel-dark));z-index:200;transition:width .3s ease,opacity .3s ease;box-shadow:0 0 8px var(--caramel)}
.toast-stack{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{position:static;animation:fadein .2s ease}
.toast.no-anim{animation:none}
.toast.err{background:var(--danger)}
.toast.ok{background:#3E6B4C}
.bell-wrap{position:relative}
.notif-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:1.5px solid var(--cream-2)}
.notif-panel{position:fixed;top:64px;right:14px;width:320px;max-width:88vw;max-height:420px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);z-index:60;animation:fadein .18s ease}
.notif-row{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.notif-row:last-child{border-bottom:none}
.notif-row.unread{background:#FBF2E1}
.skel{background:linear-gradient(90deg,var(--line) 25%,#f1e8d6 37%,var(--line) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:12px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.star-row{display:flex;gap:6px;font-size:26px;cursor:pointer}
.star{color:var(--line)}
.star.filled{color:var(--caramel-dark)}
select.input{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236B4A34'%3E%3Cpath d='M5.5 7.5l4.5 4.5 4.5-4.5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center}
.tab-fresh{animation:tabfade .22s cubic-bezier(.4,0,.2,1)}
@keyframes tabfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.wallet-card{border-radius:22px;padding:26px;background:linear-gradient(135deg,#2A180F,#4A3020 60%,#6B4A34);color:#F6F0E4;position:relative;overflow:hidden;box-shadow:0 20px 40px -16px rgba(42,24,15,.5)}
.wallet-card::after{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%)}
.tabbtn{transition:.15s}

/* ---- Responsive: keep the phone-app feel centered and clean on tablets/desktops ---- */
@media (min-width: 640px) {
  body{background:linear-gradient(180deg,#EFE2C6,var(--cream) 340px)}
  .app-frame{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);box-shadow:0 30px 90px -30px rgba(42,24,15,.35);position:relative}
  .app-frame-wide{max-width:1040px;margin:0 auto;min-height:100vh;background:var(--cream);box-shadow:0 30px 90px -30px rgba(42,24,15,.35);position:relative}
  .stat-grid{grid-template-columns:repeat(4,1fr) !important}
}
@media (min-width: 640px) and (max-width: 1039px) {
  .app-frame-wide{max-width:92vw}
}

<div id="loadbar"></div>
<div id="root"></div>
<script>
// Bumped on every real deploy. Lets a running tab/installed PWA detect a
// newer version is live on the server and prompt to refresh, instead of
// silently running stale code forever (a common PWA gotcha).
const APP_BUILD = '2026-10-12-04';
async function checkForUpdate(){
  try {
    const resp = await fetch('./index.html?_=' + Date.now(), { cache: 'no-store' });
    const text = await resp.text();
    const m = text.match(/const APP_BUILD = '([^']+)'/);
    if (m && m[1] !== APP_BUILD) {
      if (document.hidden || !state.user) { location.reload(); return; }
      state.updateAvailable = true;
      render();
      if (!document.getElementById('force-update-bar')) {
        const b = document.createElement('div'); b.id='force-update-bar';
        b.style.cssText='position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:99999;background:#3B2618;color:#F6EFE3;border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)';
        b.innerHTML='<span>A new version of Filter is ready</span><button style="background:#F6EFE3;color:#3B2618;border:0;border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px" onclick="location.reload()">Update Now</button>';
        document.body.appendChild(b);
      }
    }
  } catch (e) { /* offline or blocked — ignore, will retry */ }
}
function reloadForUpdate(){ location.reload(); }

const SUPABASE_URL = "https://zgcorxbwzdmfmkvpfwye.supabase.co";
const SUPABASE_KEY = "sb_publishable_E9eRv7AINJAQPKsHvxTc7g_GYogdFa0";
const VAPID_PUBLIC_KEY = "BKF6o9VGw55AgQhihCtHTSGIG1wMuDs2QLO0eaWX1cltzrH6NJKyQjJL9luz8sXvLdIqH7NmU3Ft9TAHBDiucDw";

// ---------------------------------------------------------------
// Minimal self-contained Supabase client (REST + Auth over fetch).
// We avoid loading the official supabase-js SDK from an external CDN
// since this sandbox only allows scripts from cdnjs.cloudflare.com,
// which does not host it. This shim talks directly to Supabase's
// PostgREST + GoTrue HTTP APIs, which is all supabase-js does anyway.
// ---------------------------------------------------------------
function authHeaders(extra){
  return Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${state.session?.access_token || SUPABASE_KEY}`,
    'Content-Type': 'application/json',
  }, extra || {});
}
async function parseJsonSafe(resp){ try { return await resp.json(); } catch(e){ return null; } }

// ---- request activity indicator ----
let _pending = 0;
// Background work (polling, update checks) runs inside _bgDepth>0 and never
// shows the bar. User-started loads only show it if they take >400ms.
let _bgDepth = 0, _loadbarTimer = null, _loadbarShown = false;
function beginRequest(bg){ if (bg) return; _pending++; updateLoadbar(); }
function endRequest(bg){ if (bg) return; _pending = Math.max(0, _pending-1); updateLoadbar(); }
function updateLoadbar(){
  const bar = document.getElementById('loadbar'); if (!bar) return;
  if (_pending > 0) {
    if (!_loadbarShown && !_loadbarTimer) _loadbarTimer = setTimeout(() => { _loadbarTimer = null; if (_pending > 0) { _loadbarShown = true; bar.style.opacity = '1'; bar.style.width = '70%'; } }, 400);
  } else {
    clearTimeout(_loadbarTimer); _loadbarTimer = null;
    if (_loadbarShown) { _loadbarShown = false; bar.style.width = '100%'; setTimeout(()=>{ if(_pending===0){ bar.style.opacity='0'; bar.style.width='0%'; } }, 200); }
  }
}

// ---- session persistence (this app runs on its own real domain now, so
// normal browser storage is safe and is how "stay signed in" actually works) ----
const SESSION_STORAGE_KEY = 'filter_auth_session';
function saveSessionToStorage(session){
  try { localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session)); } catch (e) { /* storage unavailable — session just won't persist */ }
}
function loadSessionFromStorage(){
  try { const raw = localStorage.getItem(SESSION_STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function clearSessionFromStorage(){
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) { /* ignore */ }
}

// ---- session refresh (keeps the user signed in) ----
let _refreshTimer = null;
function scheduleRefresh(session){
  clearTimeout(_refreshTimer); try { rtUpdateToken(); } catch (e) {}
  if (!session?.refresh_token || !session?.expires_in) return;
  const ms = Math.max((session.expires_in - 90) * 1000, 15000);
  _refreshTimer = setTimeout(refreshSession, ms);
}
async function refreshSession(){
  if (!state.session?.refresh_token) return false;
  try {
    const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ refresh_token: state.session.refresh_token }) });
    const json = await parseJsonSafe(resp);
    if (!resp.ok || !json?.access_token) { clearSessionFromStorage(); return false; }
    state.session = json;
    saveSessionToStorage(json);
    scheduleRefresh(json);
    return true;
  } catch (e) { return false; }
}
async function doFetch(url, opts){
  const bg = _bgDepth > 0;
  beginRequest(bg);
  try {
    let resp = await fetch(url, opts);
    if (resp.status === 401 && state.session?.refresh_token) {
      const ok = await refreshSession();
      if (ok) {
        opts.headers = Object.assign({}, opts.headers, { 'Authorization': `Bearer ${state.session.access_token}` });
        resp = await fetch(url, opts);
      }
    }
    return resp;
  } finally { endRequest(bg); }
}

function fromTable(table){
  const q = { selectCols: '*', filters: [], orderCol: null, orderAsc: true, limitN: null, method: 'GET', body: null, single: null };
  const builder = {
    select(cols){ q.selectCols = cols || '*'; return builder; },
    eq(col, val){ q.filters.push(`${col}=eq.${encodeURIComponent(val)}`); return builder; },
    in(col, vals){ q.filters.push(`${col}=in.(${(vals||[]).map(v=>encodeURIComponent('"'+String(v).replace(/"/g,'\\"')+'"')).join(',')})`); return builder; },
    order(col, opts){ q.orderCol = col; q.orderAsc = !(opts && opts.ascending === false); return builder; },
    limit(n){ q.limitN = n; return builder; },
    insert(payload){ q.method = 'POST'; q.body = payload; return builder; },
    update(payload){ q.method = 'PATCH'; q.body = payload; return builder; },
    delete(){ q.method = 'DELETE'; return builder; },
    maybeSingle(){ q.single = 'maybe'; return exec(); },
    single(){ q.single = true; return exec(); },
    then(resolve, reject){ return exec().then(resolve, reject); },
  };
  async function exec(){
    let url = `${SUPABASE_URL}/rest/v1/${table}?select=${encodeURIComponent(q.selectCols)}`;
    if (q.filters.length) url += '&' + q.filters.join('&');
    if (q.orderCol) url += `&order=${q.orderCol}.${q.orderAsc ? 'asc' : 'desc'}`;
    if (q.limitN) url += `&limit=${q.limitN}`;
    const headers = authHeaders(q.method !== 'GET' ? { 'Prefer': 'return=representation' } : {});
    let resp;
    try {
      resp = await doFetch(url, { method: q.method, headers, cache: 'no-store', body: q.body !== null ? JSON.stringify(q.body) : undefined });
    } catch (e) { return { data: null, error: { message: 'Network error: ' + e.message } }; }
    const json = await parseJsonSafe(resp);
    if (!resp.ok) return { data: null, error: { message: (json && (json.message || json.error_description || json.msg || json.hint)) || resp.statusText || 'Request failed' } };
    // An UPDATE that RLS blocks returns 200 with zero rows — that used to look
    // like a successful save even though nothing changed for customers.
    if (q.method === 'PATCH' && Array.isArray(json) && json.length === 0) return { data: null, error: { message: "Not saved — your account doesn't have permission to change this (check that you're signed in as admin)." } };
    if (q.single === true) return { data: Array.isArray(json) ? json[0] : json, error: null };
    if (q.single === 'maybe') return { data: Array.isArray(json) ? (json[0] || null) : json, error: null };
    return { data: json, error: null };
  }
  return builder;
}
async function rpcCall(fn, params){
  try {
    const resp = await doFetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', cache: 'no-store', headers: authHeaders(), body: JSON.stringify(params || {}) });
    const json = await parseJsonSafe(resp);
    if (!resp.ok) return { data: null, error: { message: (json && (json.message || json.hint || json.error_description)) || resp.statusText || 'Request failed' } };
    return { data: json, error: null };
  } catch (e) { return { data: null, error: { message: 'Network error: ' + e.message } }; }
}
const sb = {
  from: fromTable,
  rpc: rpcCall,
  auth: {
    async signUp({ email, password, options }){
      try {
        const resp = await fetch(`${SUPABASE_URL}/auth/v1/signup`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ email, password, data: options?.data || {} }) });
        const json = await parseJsonSafe(resp);
        if (!resp.ok) return { data: null, error: { message: (json && (json.msg || json.error_description || json.message)) || 'Sign up failed' } };
        if (json && json.access_token) return { data: { session: json, user: json.user }, error: null };
        return { data: { session: null, user: json }, error: null };
      } catch (e) { return { data: null, error: { message: 'Network error: ' + e.message } }; }
    },
    async signInWithPassword({ email, password }){
      try {
        const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ email, password }) });
        const json = await parseJsonSafe(resp);
        if (!resp.ok) return { data: null, error: { message: (json && (json.msg || json.error_description || json.message)) || 'Invalid email or password' } };
        return { data: { session: json, user: json.user }, error: null };
      } catch (e) { return { data: null, error: { message: 'Network error: ' + e.message } }; }
    },
    async signOut(){ return { error: null }; },
  },
};

let state = {
  session: null, profile: null, view: 'loading', tab: 'menu',
  categories: [], products: [], settings: null,
  cart: [], activeCategory: 'all', search: '', filters: { hot: false, iced: false },
  favorites: new Set(), orders: [], notifications: [], rewards: [], promotions: [],
  productModal: null, cartOpen: false, checkoutOpen: false, orderDetailId: null,
  adminTab: 'dashboard', workerOrders: [], toasts: [], authMode: 'signin', authBusy: false, authError: '',
  promoCode: '', promoResult: null, redeemPoints: 0, pickupSlots: [], notifPanelOpen: false, reviewModal: null, pushEnabled: false, iosInstallModal: false, milestones: [], pendingGiftClaims: [], myGifts: [], staffCodes: {}, chatOpen: false, chatMessages: [], chatBusy: false, chatConfigured: null, adminOrderSearch: '', adminOrderStatusFilter: 'all', membershipCardOpen: false, slotLoads: {}, missions: [], myMissions: [], orderSearch: '', payoutDetails: {}, updateAvailable: false, settingsDraft: null, payoutDraft: null,
};
const root = document.getElementById('root');
let _toastId = 0;
function setState(patch){ state = { ...state, ...patch }; render(); }
function showToast(msg, type){
  const id = ++_toastId;
  state.toasts.push({ id, msg, type: type||'info' });
  render();
  setTimeout(()=>{ state.toasts = state.toasts.filter(t=>t.id!==id); render(); }, 3200);
}
function money(n){ return 'Rs ' + Math.round(Number(n||0)).toLocaleString('en-US'); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------------- AUTH ----------------
async function init(){
  registerServiceWorker();
  // Fast first paint: show the cached menu immediately, fetch fresh data in parallel.
  const cached = hydrateMenuCache();
  const pub = loadPublicData();
  try {
    if (!cached) await pub; else pub.catch(() => {});
  } catch (e) {
    root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--coffee-700)">
      <div><h2 class="display">Couldn't reach Filter's server</h2><p style="font-size:13px;max-width:340px">${esc(e.message || 'Please check your connection and reload.')}</p></div></div>`;
    return;
  }
  const stored = loadSessionFromStorage();
  if (stored?.refresh_token) {
    state.session = stored;
    const ok = await refreshSession();
    if (ok) {
      await Promise.all([loadProfile(), pub.catch(() => {})]);
      if (pushSupported()) { const sub = await currentPushSubscription(); state.pushEnabled = !!sub; }
      setState({ view: state.profile?.role || 'customer' }); maybeOpenReceiptFromUrl();
      startPolling();
      startUpdateChecks();
      return;
    }
    state.session = null;
    clearSessionFromStorage();
  }
  setState({ view: 'auth' });
  startPolling();
  startUpdateChecks();
}
function startUpdateChecks(){
  checkForUpdate();
  setInterval(checkForUpdate, 30000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(); });
  window.addEventListener('focus', checkForUpdate);
}
async function onLoginSuccess(session){
  state.session = session;
  saveSessionToStorage(session);
  scheduleRefresh(session);
  hydrateMenuCache();
  await Promise.all([loadPublicData(), loadProfile()]);
  rtStart();
  if (pushSupported()) { const sub = await currentPushSubscription(); state.pushEnabled = !!sub; }
  setState({ view: state.profile?.role || 'customer' }); maybeOpenReceiptFromUrl();
  if ((state.profile?.role === 'admin' || state.profile?.role === 'worker') && pushSupported() && !state.pushEnabled) {
    setTimeout(() => showToast('🔔 Tap "Enable Alerts" up top so you get notified the moment an order comes in', 'info'), 1200);
  }
}
async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  if (error) { showToast(error.message); return; }
  state.profile = data;
  if (data?.role === 'customer') await Promise.all([loadFavorites(), loadOrders(), loadNotifications(), refreshMilestones(), loadMyGifts(), loadMyMissions()]);
  if (data?.role === 'worker') await Promise.all([loadWorkerOrders(), loadNotifications()]);
  if (data?.role === 'admin') await Promise.all([loadWorkerOrders(), loadNotifications()]);

// True while the person is actively typing/selecting somewhere — a background
// refresh must never blow away an in-progress edit by rebuilding the screen.

// ---------------- REALTIME (v19) ----------------
// Tiny Supabase Realtime client (Phoenix websocket). Any change to orders /
// my notifications triggers an immediate refresh; polling stays as fallback.
const RT = { ws: null, ref: 0, hb: null, joined: false, retry: 1000, timer: null, topic: null, wantUid: null };
function rtStart(){
  if (!state.session || !('WebSocket' in window)) return;
  const uid = state.session.user.id;
  if (RT.ws && RT.wantUid === uid && RT.ws.readyState <= 1) return;
  rtStop(); RT.wantUid = uid;
  const url = SUPABASE_URL.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(SUPABASE_KEY) + '&vsn=1.0.0';
  let ws; try { ws = new WebSocket(url); } catch (e) { return rtRetry(); }
  RT.ws = ws;
  const staff = ['admin','worker'].includes(state.profile?.role);
  const changes = [
    staff ? { event: '*', schema: 'public', table: 'orders' } : { event: '*', schema: 'public', table: 'orders', filter: 'customer_id=eq.' + uid },
    { event: 'INSERT', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + uid },
  ];
  RT.topic = 'realtime:filter-' + uid.slice(0, 8);
  ws.onopen = () => {
    RT.retry = 1000;
    rtSend(RT.topic, 'phx_join', { config: { broadcast: { self: false }, presence: { key: '' }, postgres_changes: changes }, access_token: state.session.access_token });
    clearInterval(RT.hb); RT.hb = setInterval(() => rtSend('phoenix', 'heartbeat', {}), 25000);
  };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.topic !== RT.topic) return;
    if (m.event === 'phx_reply' && m.payload?.status === 'ok' && !RT.joined) { RT.joined = true; setPollRate(); }
    if (m.event === 'postgres_changes') rtKick();
    if (m.event === 'system' && m.payload?.status === 'error') { RT.joined = false; setPollRate(); }
  };
  ws.onclose = () => { RT.joined = false; clearInterval(RT.hb); setPollRate(); if (RT.ws === ws) rtRetry(); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
function rtSend(topic, event, payload){ try { if (RT.ws && RT.ws.readyState === 1) RT.ws.send(JSON.stringify({ topic, event, payload, ref: String(++RT.ref) })); } catch (e) {} }
function rtRetry(){ clearTimeout(RT.timer); if (!state.session) return; RT.timer = setTimeout(rtStart, RT.retry); RT.retry = Math.min(RT.retry * 2, 30000); }
function rtStop(){ clearTimeout(RT.timer); clearInterval(RT.hb); RT.joined = false; const w = RT.ws; RT.ws = null; if (w) try { w.close(); } catch (e) {} }
function rtUpdateToken(){ if (RT.joined && state.session) rtSend(RT.topic, 'access_token', { access_token: state.session.access_token }); }
let _rtKickT = null;
function rtKick(){ clearTimeout(_rtKickT); _rtKickT = setTimeout(() => pollTick({ fast: true }), 150); }
// Poll every 4s without realtime; every 20s as a safety net when the socket is live.
let _pollIv = null;
function setPollRate(){ clearInterval(_pollIv); _pollIv = setInterval(pollTick, RT.joined ? 20000 : 4000); }

// New-order alert: chime + vibration + tappable banner (when the app is open).
let _audioCtx = null;
function unlockAudio(){ try { if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (_audioCtx.state === 'suspended') _audioCtx.resume(); } catch (e) {} }
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function chime(){
  try { unlockAudio(); const c = _audioCtx; if (!c) return; const t = c.currentTime;
    [[880, 0], [1320, 0.16]].forEach(([f, d]) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.45); o.connect(g); g.connect(c.destination); o.start(t + d); o.stop(t + d + 0.5); });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([180, 80, 180]); } catch (e) {}
}
function showNewOrderBanner(o){

let _polling = false;
let _pollN = 0;
function startPolling(){
  setPollRate(); rtStart();
  // Phones pause timers while the app is in the background — refresh the
  // instant the person comes back so they never look at stale data.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { rtStart(); pollTick(); } });
  window.addEventListener('focus', () => pollTick());
}
// Cheap fingerprint of everything polling can change; if it's identical after
// a poll we don't touch the DOM at all (no flicker, no lost scroll/taps).
function pollSignature(){
  try { return JSON.stringify([state.categories, state.products, state.settings, state.rewards, state.promotions, state.orders, state.notifications, state.myGifts, state.profile, state.workerOrders]); }
  catch (e) { return String(Math.random()); }
}
// A customizer/sheet the person is using is never rebuilt by background data;
// it picks up fresh data the next time they interact.
function modalInUse(){ return !!(state.customerProfile || state.productModal || state.checkoutOpen || state.cartOpen || state.reviewModal || state.chatOpen || state.membershipCardOpen || state.orderDetailId || state.iosInstallModal || state.adminMoreOpen || state.receiptOrderId); }
async function pollTick(opts){
    const fast = !!(opts && opts.fast);
    if (_polling) { if (fast) setTimeout(() => pollTick(opts), 400); return; }
    if (!state.session || !state.profile) return;
    _polling = true;
    _bgDepth++;
    const _sigBefore = pollSignature();
    try {
      // Keep the menu, categories, prices, availability, promos and rewards in
      // sync for EVERYONE signed in — so an admin's edit shows up for an
      // already-open customer session without them needing to reload.
      // Menu/settings change rarely: refresh them every 3rd tick (or on realtime
      // order events skip them entirely) — keeps each poll light.
      _pollN++;
      if (!fast && (_pollN % 3 === 1 || !RT.joined)) await loadPublicData();

      if (state.profile.role === 'customer') {
        const prevStatus = Object.fromEntries(state.orders.map(o => [o.id, o.status]));
        const prevPoints = state.profile.loyalty_points;
        const prevGiftCount = (state.myGifts||[]).length;
        await loadOrders();
        const statusChanges = state.orders.filter(o => prevStatus[o.id] && prevStatus[o.id] !== o.status);
        await Promise.all([loadNotifications(), loadMyGifts()]);
        const { data: freshProfile } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
        let pointsGained = 0;
        if (freshProfile) {
          if (prevPoints != null && freshProfile.loyalty_points > prevPoints) pointsGained = freshProfile.loyalty_points - prevPoints;
          state.profile = freshProfile;
        }
        const giftUnlocked = (state.myGifts||[]).length > prevGiftCount;

        if (isEditingSomething()) return; // data is fresh in state; screen updates next safe render
        statusChanges.forEach(o => showToast(`Order #${o.order_number} is now ${o.status}`));
        if (pointsGained > 0) showToast(`+${pointsGained} loyalty points earned!`, 'ok');
        if (giftUnlocked) showToast('🎁 You unlocked a free gift! Check Rewards.', 'ok');
        if (pollSignature() !== _sigBefore && !modalInUse()) render();
      } else if (state.profile.role === 'worker' || state.profile.role === 'admin') {
        const prevIds = new Set(state.workerOrders.map(o => o.id)), hadAny = state.workerOrders.length > 0 || _pollN > 1;
        await Promise.all([loadWorkerOrders(), loadNotifications()]);
        const fresh = hadAny ? state.workerOrders.filter(o => !prevIds.has(o.id) && o.status === 'pending') : [];
        if (fresh.length) { chime(); showNewOrderBanner(fresh[0]); }

        if (isEditingSomething()) return; // never wipe an in-progress edit (settings, product form, etc.)
        if (pollSignature() !== _sigBefore && !modalInUse()) render();
      }
    } catch (e) { /* silent — retry on next tick */ }
    finally { _polling = false; _bgDepth = Math.max(0, _bgDepth - 1); }
}

function cartKey(item){ return item.product_id + '|' + item.size_name + '|' + item.choices.map(c=>c.name).sort().join(',') + '|' + item.notes; }
function addToCart(item){
  const existing = state.cart.find(c => cartKey(c) === cartKey(item));
  if (existing) existing.qty += item.qty; else state.cart.push(item);
  setState({ productModal: null }); showToast('Added to cart');
}
function removeFromCart(idx){ state.cart.splice(idx,1); render(); }
function cartLineTotal(item){ return (item.unit_price) * item.qty; }
function cartSubtotal(){ return state.cart.reduce((s,i)=>s+cartLineTotal(i),0); }

// ---------------- ORDER PLACEMENT ----------------
async function placeOrder({ pickupDate, pickupTime, notes }){
  const subtotal = cartSubtotal();
  const taxRate = Number(state.settings?.tax_rate || 0);
  let discount = 0, promoId = null;
  if (state.promoResult) { discount += Number(state.promoResult.calculated_discount); promoId = state.promoResult.promo_id; }
  const loyaltyDiscount = state.redeemPoints * Number(state.settings?.loyalty_point_value || 0.01);
  discount += loyaltyDiscount;
  const taxable = Math.max(subtotal - discount, 0);
  const tax = +(taxable * taxRate).toFixed(2);
  const total = +(taxable + tax).toFixed(2);
  const pointsEarned = Math.floor(total * Number(state.settings?.loyalty_points_per_currency || 1));

  const { data: order, error } = await sb.from('orders').insert({
    customer_id: state.session.user.id, status: 'pending', fulfillment_type: 'pickup',
    pickup_date: pickupDate, pickup_time: pickupTime, subtotal, discount_amount: +discount.toFixed(2),
    tax_amount: tax, total, loyalty_points_redeemed: state.redeemPoints, loyalty_discount_amount: +loyaltyDiscount.toFixed(2),
    loyalty_points_earned: pointsEarned, promo_id: promoId, special_instructions: notes, payment_method: availablePayMethods().includes(state.payMethod) ? state.payMethod : 'cash', tip: tipAmt(),
  }).select().single();
  if (error) { showToast('Order failed: ' + error.message, 'err'); return null; }

  let itemsFailed = false;
  for (const item of state.cart) {
    const { data: oi, error: oiErr } = await sb.from('order_items').insert({
      order_id: order.id, product_id: item.product_id, product_name: item.name, size_name: item.size_name,
      size_price_modifier: item.size_mod, unit_price: item.unit_price, quantity: item.qty,
      line_total: cartLineTotal(item), special_instructions: item.notes,
    }).select().single();
    if (oiErr) { itemsFailed = true; showToast('Some items failed to save: ' + oiErr.message, 'err'); continue; }
    if (item.choices.length) {
      const { error: optErr } = await sb.from('order_item_options').insert(item.choices.map(c => ({ order_item_id: oi.id, choice_name: c.name, price_modifier: c.price_modifier })));
      if (optErr) itemsFailed = true;
    }
  }
  if (itemsFailed) showToast(`Order #${order.order_number} was created but some details didn't save — please tell staff or call ${state.settings?.support_phone || ''}`, 'err');
  if (state.redeemPoints > 0) await sb.rpc('redeem_points_for_order', { p_order_id: order.id, p_points: state.redeemPoints });
  if (promoId) await sb.rpc('record_promo_redemption', { p_order_id: order.id, p_promo_id: promoId });

  await loadProfile();
  setState({ cart: [], checkoutOpen: false, promoCode: '', promoResult: null, redeemPoints: 0, tip: 0, tipCustom: false, view: 'customer', tab: 'orders' });
  showToast(`Order #${order.order_number} placed! 🎉`, 'ok');
  return order;
}

let _modalWasOpen = {};
function justOpened(key, isOpenNow){
  const was = !!_modalWasOpen[key];
  _modalWasOpen[key] = !!isOpenNow;
  return !!isOpenNow && !was;
}
let _lastTab = null;
function tabJustChanged(tab){
  const changed = tab !== _lastTab;
  _lastTab = tab;
  return changed;

// ---- Scroll protection: every scrolled container (chip rows, sheets, lists)
// and the page keep their position across re-renders. Containers are keyed by
// id if they have one, else by their position in the DOM tree.
function _domKey(el){
  if (el.id) return '#' + el.id;
  const parts = [];
  while (el && el !== root) { const par = el.parentElement; if (!par) break; parts.unshift(Array.prototype.indexOf.call(par.children, el) + ':' + el.tagName); el = par; }
  return parts.join('/');
}
function captureScrolls(){
  const out = { win: [window.scrollX, window.scrollY], els: {} };
  root.querySelectorAll('*').forEach(el => { if (el.scrollLeft || el.scrollTop) out.els[_domKey(el)] = [el.scrollLeft, el.scrollTop]; });
  return out;
}
function restoreScrolls(s){
  Object.entries(s.els).forEach(([k, [x, y]]) => {
    const el = k[0] === '#' ? document.getElementById(k.slice(1)) : _byKey(k);
    if (el) { el.scrollLeft = x; el.scrollTop = y; }
  });
  if (window.scrollX !== s.win[0] || window.scrollY !== s.win[1]) window.scrollTo(s.win[0], s.win[1]);
}
function _byKey(k){
  let el = root;
  for (const part of k.split('/')) { const [i, tag] = part.split(':'); el = el && el.children[Number(i)]; if (!el || el.tagName !== tag) return null; }
  return el;
}
// ---- Form protection: ANY re-render (polling, toasts, button taps) used to
// rebuild inputs from state and wipe what the person had typed. We remember
// every value the person types (by element id) and put it back after each
// render. An entry is forgotten as soon as its field leaves the screen
// (form saved/closed, tab changed), so fresh data shows next time.
const _typed = {};
function _rememberTyped(e){
  const el = e.target;
  if (!el || !el.id || !root.contains(el)) return;
  if (!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.type === 'file') return;
  _typed[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? { checked: el.checked } : { value: el.value };
}
document.addEventListener('input', _rememberTyped, true);
document.addEventListener('change', _rememberTyped, true);
function forgetTyped(prefix){ Object.keys(_typed).forEach(k => { if (!prefix || k.startsWith(prefix)) delete _typed[k]; }); }
function restoreTypedValues(activeId, selStart, selEnd){
  Object.keys(_typed).forEach(id => {
    const el = document.getElementById(id);
    if (!el) { delete _typed[id]; return; }
    const v = _typed[id];
    if ('checked' in v) el.checked = v.checked; else if (el.value !== v.value) el.value = v.value;
  });
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && document.activeElement !== el) {
      try { el.focus({ preventScroll: true }); if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch (e) {}
    }
  }
}

async function registerStaffWithCode(){
  const full_name = document.getElementById('sr-name').value.trim();
  const email = document.getElementById('sr-email').value.trim();
  const password = document.getElementById('sr-pass').value;
  const role = document.getElementById('sr-role').value;
  const code = document.getElementById('sr-code').value.trim();
  if (!full_name || !email || !password || !code) { state.authError = 'Please fill in every field'; return render(); }
  if (password.length < 6) { state.authError = 'Password must be at least 6 characters'; return render(); }
  state.authBusy = true; state.authError = ''; render();
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/register-staff-with-code`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, full_name, role, code }),
    });
    const json = await parseJsonSafe(resp);
    state.authBusy = false;
    if (!resp.ok) { state.authError = json?.error || 'Could not create account'; return render(); }
    showToast('Account created — sign in below', 'ok');
    setState({ authMode: 'staff' });
  } catch (e) { state.authBusy = false; state.authError = 'Network error: ' + e.message; render(); }
}
function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('af-email').value.trim();
  const pass = document.getElementById('af-pass').value;
  state._afEmail = email;
  if (state.authMode === 'signup') { const name = document.getElementById('af-name').value.trim(); state._afName = name; signUp(email, pass, name); }
  else signIn(email, pass);
  return false;
}

function productEmoji(p){
  const tags = (p.tags||[]).join(' ').toLowerCase();
  const name = (p.name||'').toLowerCase();
  if (tags.includes('tea') || name.includes('tea') || name.includes('chai')) return p.is_iced ? '🧊' : '🍵';
  if (tags.includes('chocolate') || name.includes('chocolate')) return '🍫';
  if (tags.includes('bakery')) return '🥐';
  if (p.is_iced) return '🧊';
  return '☕';
}
function filteredProducts(){
  return state.products.filter(p=>{
    if (state.activeCategory!=='all' && p.category_id!==state.activeCategory) return false;
    if (state.search && !p.name.toLowerCase().includes(state.search.toLowerCase()) && !(p.description||'').toLowerCase().includes(state.search.toLowerCase())) return false;
    if (state.filters.hot && !p.is_hot) return false;
    if (state.filters.iced && !p.is_iced) return false;
    return true;
  });
}

function fmtTime12(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'pm':'am'; const hh=((h+11)%12)+1; return m?`${hh}:${String(m).padStart(2,'0')}${ap}`:`${hh}${ap}`; }
function shopStatus(){
  const st=state.settings||{}; const o=(st.open_time||'07:00').slice(0,5), c=(st.close_time||'19:00').slice(0,5);
  const d=new Date(); const now=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const hours=`${fmtTime12(o)} – ${fmtTime12(c)}`;
  if (st.is_accepting_orders===false) return {open:false, text:'Not taking orders right now', hours};
  const inHours = o<=c ? (now>=o && now<c) : (now>=o || now<c);
  if (inHours) return {open:true, text:`Open now · until ${fmtTime12(c)}`, hours};
  return {open:false, text:`Closed · opens ${fmtTime12(o)}`, hours};
}
function renderShopStatus(){
  const s=shopStatus();

function renderLiveOrderBanner(){

  const steps={pending:['Order received',"We'll confirm it shortly",1],accepted:['Order confirmed',"We'll start it soon",2],preparing:['Being made now','Almost there',3],ready:['Your order is ready!','Come pick it up at the counter',4]};

function renderRatePrompt(){
  if (!state._myRevLoaded && !state._myRevLoading && state.session){ state._myRevLoading=true; sb.from('reviews').select('order_id').eq('customer_id',state.session.user.id).then(({data})=>{ state.myReviewOrders=(data||[]).map(x=>x.order_id); state._myRevLoaded=true; if(state.tab==='menu') render(); }); }
  if (!state._myRevLoaded) return '';
  let dismissed=[]; try{ dismissed=JSON.parse(localStorage.getItem('filter_rate_dismissed')||'[]'); }catch(e){}
  const o=(state.orders||[]).find(x=>x.status==='completed' && Date.now()-new Date(x.completed_at||x.created_at).getTime()<3*86400000 && !state.myReviewOrders.includes(x.id) && !dismissed.includes(x.id) && (x.order_items||[]).some(i=>i.product_id));

async function drawReceiptCanvas(d){
  const W = 420, S = 3, P = 28; const lines = [];
  const c = document.createElement('canvas'); const x = c.getContext('2d');
  const serif = "600 26px Fraunces, Georgia, serif", sans = n => `${n} 'Inter', -apple-system, Helvetica, Arial, sans-serif`;
  // pre-layout to compute height
  const wrap = (text, font, maxW) => { x.font = font; const words = String(text).split(' '); const out = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; };
  const ops = []; let y = P;
  const push = (h, fn) => { const yy = y; ops.push(() => fn(yy)); y += h; };
  push(64, yy => {}); // logo
  push(34, yy => { x.font = serif; x.fillStyle = '#2A180F'; x.textAlign = 'center'; x.fillText(d.biz, W/2, yy + 26); });
  push(20, yy => { x.font = sans('500 13px'); x.fillStyle = '#6B4A34'; x.textAlign = 'center'; x.fillText(d.tagline, W/2, yy + 14); });
  for (const t of [d.phone].filter(Boolean)) for (const l of wrap(t, sans('400 12px'), W - 2*P)) push(17, yy => { x.font = sans('400 12px'); x.fillStyle = '#6B4A34'; x.textAlign = 'center'; x.fillText(l, W/2, yy + 12); });
  const sep = () => push(22, yy => { x.strokeStyle = '#D9C7A8'; x.setLineDash([4, 4]); x.beginPath(); x.moveTo(P, yy + 11); x.lineTo(W - P, yy + 11); x.stroke(); x.setLineDash([]); });
  const row = (l, v, opt = {}) => push(opt.h || 22, yy => { x.font = sans(opt.w || '400 13px'); x.fillStyle = opt.c || '#2A180F'; x.textAlign = 'left'; x.fillText(l, P, yy + 15); x.textAlign = 'right'; x.font = sans(opt.vw || opt.w || '600 13px'); x.fillText(v, W - P, yy + 15); });
  sep();
  row('Order', '#' + d.num, { vw: '700 14px' });
  row('Placed', d.placed.toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'}) + ' · ' + d.placed.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}), {c:'#4A3020'});
  row('Pickup', d.pickup, {c:'#4A3020'});
  if (d.customer) row('Customer', d.customer, {c:'#4A3020'});
  sep();
  for (const i of d.items) {
    const nl = wrap(i.name, sans('600 14px'), W - 2*P - 90);
    nl.forEach((l, k) => push(20, yy => { x.font = sans('600 14px'); x.fillStyle = '#2A180F'; x.textAlign = 'left'; x.fillText(l, P, yy + 15); if (!k) { x.textAlign = 'right'; x.fillText(money(i.price), W - P, yy + 15); } }));
    if (i.opts) wrap(i.opts, sans('400 12px'), W - 2*P - 12).forEach(l => push(17, yy => { x.font = sans('400 12px'); x.fillStyle = '#8A6A52'; x.textAlign = 'left'; x.fillText(l, P + 12, yy + 12); }));
    y += 6;
  }
  sep();
  row('Subtotal', money(d.sub), {c:'#4A3020'});
  if (d.promo) row('Promo discount', '−' + money(d.promo), {c:'#4A3020'});
  if (d.ptsDiscount) row(`Points redeemed (${d.ptsRedeemed})`, '−' + money(d.ptsDiscount), {c:'#4A3020'});
  if (d.tax) row('Tax', money(d.tax), {c:'#4A3020'});
  if (d.tip) row('Tip — thank you!', money(d.tip), {c:'#4A3020'});
  y += 4; row('Total', money(d.total), { w: '700 17px', h: 30 });
  push(44, yy => { const bw = 250, bx = (W - bw)/2; x.fillStyle = d.paid ? '#E3EEDF' : '#F6E7CC'; x.beginPath(); x.roundRect ? x.roundRect(bx, yy + 6, bw, 30, 15) : x.rect(bx, yy + 6, bw, 30); x.fill(); x.font = sans('700 13px'); x.fillStyle = d.paid ? '#3F6B3A' : '#8A5A1E'; x.textAlign = 'center'; x.fillText((d.paid ? '✓ Paid' : 'Payment pending') + ' · ' + d.method, W/2, yy + 26); });
  if (d.earned) push(20, yy => { x.font = sans('500 12px'); x.fillStyle = '#6B4A34'; x.textAlign = 'center'; x.fillText(`★ ${d.earned} loyalty points ${d.paid ? 'earned' : 'on payment'}`, W/2, yy + 14); });
  if (d.notes) wrap('Notes: ' + d.notes, sans('400 12px'), W - 2*P).forEach(l => push(17, yy => { x.font = sans('400 12px'); x.fillStyle = '#6B4A34'; x.textAlign = 'left'; x.fillText(l, P, yy + 12); }));
  sep();
  push(28, yy => { x.font = "600 18px Fraunces, Georgia, serif"; x.fillStyle = '#2A180F'; x.textAlign = 'center'; x.fillText(`Thank you for choosing ${d.biz}`, W/2, yy + 20); });
  push(18, yy => { x.font = sans('400 12px'); x.fillStyle = '#6B4A34'; x.textAlign = 'center'; x.fillText('See you again soon!', W/2, yy + 12); });
  const H = y + P;
  c.width = W * S; c.height = H * S; x.scale(S, S);
  // paper
  x.fillStyle = '#F6F0E4'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#FFFDF9'; x.beginPath(); x.roundRect ? x.roundRect(10, 10, W - 20, H - 20, 18) : x.rect(10, 10, W - 20, H - 20); x.fill();
  x.fillStyle = '#4A3020'; x.fillRect(10, 10, W - 20, 0); 
  const logo = await loadImg('./icon-192.png'); if (logo) { x.save(); x.beginPath(); x.arc(W/2, P + 28, 28, 0, Math.PI*2); x.clip(); x.drawImage(logo, W/2 - 28, P, 56, 56); x.restore(); }
  ops.forEach(f => f());
  return c;
}

async function saveReceiptImage(){

  if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {

async function uploadQrImage(file){
  if (!file) return; if (!/^image\//.test(file.type)) return showToast('Please choose an image', 'err');
  if (file.size > 5 * 1024 * 1024) return showToast('Image is too large (max 5 MB)', 'err');
  showToast('Uploading…', 'info');
  try {
    const ext = ((file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'png';
    const path = `payment-qr/${Date.now()}.${ext}`;
    const resp = await doFetch(`${SUPABASE_URL}/storage/v1/object/product-images/${path}`, { method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${state.session.access_token}`, 'Content-Type': file.type, 'x-upsert': 'true' }, body: file });
    if (!resp.ok) { const j = await parseJsonSafe(resp); throw new Error((j && (j.message || j.error)) || 'Upload failed'); }
    state.qrDraftUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`;
    refreshQrSettings(); showToast('Uploaded — tap Save QR settings', 'ok');
  } catch (e) { showToast('Upload failed: ' + e.message, 'err'); }
}
async function saveQrSettings(){
  const url = state.qrDraftUrl !== undefined ? state.qrDraftUrl : (state.settings?.pay_qr_url || '');
  const on = !!document.getElementById('qr-on')?.checked;
  if (on && !url) return showToast('Upload a QR image first', 'err');
  const payload = { pay_qr_url: url || null, pay_qr_label: (document.getElementById('qr-label')?.value || '').trim() || null, pay_qr_enabled: on };
  const { data, error } = await sb.from('business_settings').update(payload).eq('id', true).select();
  if (error || !data?.length) return showToast('Not saved: ' + (error?.message || 'no permission'), 'err');
  Object.assign(state.settings, data[0]); state.qrDraftUrl = undefined; forgetTyped('qr-');
  refreshQrSettings(); showToast('QR settings saved', 'ok');
}

async function openCheckout(){
  setState({ cartOpen: false, checkoutOpen: true, slotLoads: {} });
  try {
    const today = new Date(); const tomorrow = new Date(); tomorrow.setDate(today.getDate()+1);
    const [r1, r2, r3] = await Promise.all([
      sb.rpc('get_slot_load', { p_date: localDateStr(today) }),
      sb.rpc('get_slot_load', { p_date: localDateStr(tomorrow) }),
      sb.from('payout_details').select('*').maybeSingle(),
    ]);
    const loads = {};
    (r1.data||[]).forEach(row => loads[`${localDateStr(today)}|${row.slot_time.slice(0,5)}`] = Number(row.order_count));
    (r2.data||[]).forEach(row => loads[`${localDateStr(tomorrow)}|${row.slot_time.slice(0,5)}`] = Number(row.order_count));
    state.slotLoads = loads;
    state.payoutDetails = r3.data || {};
    render();
  } catch (e) { /* non-critical — checkout still works without load data */ }
}
function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function pickupSlotOptions(){
  const open = state.settings?.open_time || '07:00', close = state.settings?.close_time || '19:00';
  const interval = state.settings?.pickup_slot_interval_minutes || 15;
  const buffer = state.settings?.order_prep_buffer_minutes || 5;
  const maxPerSlot = state.settings?.max_orders_per_slot || 4;
  const now = new Date();
  const slots = [];
  for (let d=0; d<2; d++){
    const date = new Date(now); date.setDate(now.getDate()+d);
    const dateStr = localDateStr(date);
    let [oh,om] = open.split(':').map(Number), [ch,cm] = close.split(':').map(Number);
    let cur = new Date(date); cur.setHours(oh,om,0,0);
    const end = new Date(date); end.setHours(ch,cm,0,0);
    const earliest = new Date(now.getTime() + buffer*60000);
    while (cur < end) {
      if (d>0 || cur >= earliest) {
        const timeStr = cur.toTimeString().slice(0,5);
        const load = (state.slotLoads||{})[`${dateStr}|${timeStr}`] || 0;
        slots.push({ date: dateStr, time: timeStr, label: `${d===0?'Today':'Tomorrow'} · ${cur.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`, load });
      }
      cur = new Date(cur.getTime() + interval*60000);
    }
  }
  const candidates = slots.slice(0, 24);
  const quietest = candidates.filter(s=>s.load < maxPerSlot).sort((a,b)=>a.load-b.load)[0];
  return candidates.map(s => ({ ...s, recommended: quietest && s.date===quietest.date && s.time===quietest.time }));
}

function fallbackAnswer(question){
  const q = question.toLowerCase();
  const phone = state.settings?.support_phone || '03014022888';
  if (/hour|open|close|time.*open/.test(q)) return `We're open from ${state.settings?.open_time||'07:00'} to ${state.settings?.close_time||'19:00'} daily.`;
  if (/phone|contact|number|whatsapp|call/.test(q)) return `You can reach us at ${phone}.`;
  if (/menu|drink|have|price|cost|rs\b/.test(q)) {
    const lines = state.products.filter(p=>p.is_available).map(p=>`${p.name} — ${money(p.base_price)}`);
    return `Here's what we have:\n${lines.join('\n')}`;

  if (/point|loyalty|reward|gift/.test(q)) return `You earn 1 point for every Rs ${Math.round(1/(state.settings?.loyalty_points_per_currency||0.1))} spent, credited once your payment is confirmed. Check the Rewards tab for gifts you can unlock!`;
  if (/pickup|order|how.*work/.test(q)) return `Browse the menu, add items to your cart, pick a pickup time, and pay in person when you collect your order.`;
  return `I'm not sure about that one — for anything specific, message us directly at ${phone}.`;
}

function handleChatSubmit(e){
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || state.chatBusy) return false;
  input.value = ''; delete _typed['chat-input'];
  sendChatMessage(text);
  return false;
}
async function sendChatMessage(text){
  state.chatMessages.push({ role: 'user', content: text });
  state.chatBusy = true;
  render();
  scrollChatToBottom();
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/ai-chat`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${state.session.access_token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: state.chatMessages.map(m => ({ role: m.role, content: m.content })) }),
    });
    const json = await parseJsonSafe(resp);
    if (json?.not_configured) {
      state.chatConfigured = false;
      state.chatMessages.push({ role: 'assistant', content: fallbackAnswer(text) });
    } else if (json?.reply) {
      state.chatConfigured = true;
      state.chatMessages.push({ role: 'assistant', content: json.reply });
    } else {
      state.chatMessages.push({ role: 'assistant', content: fallbackAnswer(text) });
    }
  } catch (e) {
    state.chatMessages.push({ role: 'assistant', content: fallbackAnswer(text) });
  }
  state.chatBusy = false;
  render();
  scrollChatToBottom();
}
function scrollChatToBottom(){ setTimeout(() => { const el = document.getElementById('chat-scroll'); if (el) el.scrollTop = el.scrollHeight; }, 30); }

function computeTasteProfile(){
  const counts = {}; let hot = 0, cold = 0;
  state.orders.forEach(o => (o.order_items||[]).forEach(oi => {
    counts[oi.product_name] = (counts[oi.product_name]||0) + oi.quantity;
    const prod = state.products.find(p => p.name === oi.product_name);
    if (prod?.is_iced) cold += oi.quantity; else if (prod?.is_hot) hot += oi.quantity;
  }));
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (!sorted.length) return null;
  const total = hot + cold;
  return { favorite: sorted[0][0], favoriteCount: sorted[0][1], hotPct: total?Math.round(hot/total*100):50, coldPct: total?Math.round(cold/total*100):50 };
}

function orderUrgencyMinutes(o){
  if (!o.pickup_date || !o.pickup_time) return 999;
  const target = new Date(`${o.pickup_date}T${o.pickup_time}`);
  return Math.round((target - new Date()) / 60000);
}
function sortByUrgency(orders){
  return [...orders].sort((a,b) => orderUrgencyMinutes(a) - orderUrgencyMinutes(b));
}

      <button class="btn btn-outline" style="flex:1;font-size:11px;padding:7px" onclick="setState({orderDetailId:'${o.id}'})">Details</button>
      ${nextStatus ? `<button class="btn btn-primary" style="flex:2;font-size:11px;padding:7px" onclick="updateOrderStatus('${o.id}','${nextStatus}')">${nextLabel}</button>` : ''}
      ${canCancel(o) ? `<button class="btn btn-ghost" style="font-size:16px;padding:0;min-width:44px;color:var(--danger);background:rgba(230,217,194,.5)" aria-label="Cancel order" title="Cancel order" onclick="cancelOrder('${o.id}')">✕</button>` : ''}
    </div>
  </div>`;
}
function canCancel(o){
  const role = state.profile?.role;
  return (role === 'admin' || role === 'worker') && o && o.status !== 'completed' && o.status !== 'cancelled';
}
async function cancelOrder(id){
  const o = state.workerOrders.find(x => x.id === id);
  if (!confirm(`Cancel order #${o?.order_number || ''}? The customer will be notified${o?.payment_confirmed ? ' and any points from this order will be taken back' : ''}.`)) return;
  const reasonRaw = prompt('Reason for cancelling (optional, shown to the customer):', '');
  if (reasonRaw === null) return;
  const reason = reasonRaw.trim().slice(0, 200);
  // Optimistic: fade the card out and drop it from active lists right away.
  const prev = o ? { status: o.status, cancel_reason: o.cancel_reason } : null;
  document.querySelectorAll(`[data-order-id="${id}"]`).forEach(el => el.classList.add('fade-out'));
  if (o) { o.status = 'cancelled'; o.cancel_reason = reason || null; }
  if (state.orderDetailId === id) state.orderDetailId = null;
  setTimeout(() => render(), 220);
  const { error } = await sb.from('orders').update({ status: 'cancelled', cancel_reason: reason || null }).eq('id', id);
  if (error) {
    if (o && prev) Object.assign(o, prev);
    showToast(error.message, 'err'); render(); return;
  }
  showToast(`Order #${o?.order_number || ''} cancelled`, 'ok');
  await loadWorkerOrders(); render();
}
async function updateOrderStatus(id, status){
  const { error } = await sb.from('orders').update({ status, assigned_worker_id: state.session.user.id }).eq('id', id);
  if (error) return showToast(error.message);
  await loadWorkerOrders(); render();
}

function renderDailyClose(orders, today){
  const t = orders.filter(o => o.status !== 'cancelled' && !o.excluded_from_sales && localDateStr(new Date(o.created_at)) === today);
  const paid = t.filter(o => o.payment_confirmed).reduce((a, o) => a + Number(o.total || 0), 0);
  const unpaidOrders = t.filter(o => !o.payment_confirmed);
  const unpaid = unpaidOrders.reduce((a, o) => a + Number(o.total || 0) + Number(o.tip || 0), 0);
  const tips = t.filter(o => o.payment_confirmed).reduce((a, o) => a + Number(o.tip || 0), 0);
  const cnt = {}; t.forEach(o => (o.order_items || []).forEach(i => cnt[i.product_name] = (cnt[i.product_name] || 0) + i.quantity));
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  const accepting = state.settings?.is_accepting_orders !== false;
  return `<div class="card close-card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="display" style="font-size:17px">Daily close</div>
      <button class="pill-toggle ${accepting?'on':''}" onclick="toggleAccepting()" aria-pressed="${accepting}"><span class="dot"></span>${accepting?'Taking orders':'Orders paused'}</button></div>
    <div class="close-grid">
      <div><span class="meta">Collected</span><b>${money(paid)}</b></div>
      <div><span class="meta">To collect</span><b style="color:${unpaid?'#8A5A1E':'inherit'}">${money(unpaid)}</b><span class="meta">${unpaidOrders.length} unpaid${unpaidOrders.some(o=>o.payment_method&&o.payment_method!=='cash')?` · ${unpaidOrders.filter(o=>o.payment_method&&o.payment_method!=='cash').length} to verify`:''}</span></div>
      <div><span class="meta">Tips</span><b>${money(tips)}</b></div>
      <div><span class="meta">Top today</span><b style="font-size:14px">${top ? esc(top[0]) + ' ×' + top[1] : '—'}</b></div>
    </div></div>`;
}
async function toggleAccepting(){
  const next = !(state.settings?.is_accepting_orders !== false);

  const { error } = await sb.from('business_settings').update({ is_accepting_orders: next }).eq('id', true);

// ================= FILTER INSIGHTS =================
function renderAdminInsights(){
  const orders = state.workerOrders.filter(o=>o.payment_confirmed && !o.excluded_from_sales);
  if (!orders.length) return `<div class="card" style="padding:24px;text-align:center;color:var(--coffee-500)">Insights will appear here once you have a few paid orders.</div>`;

  const avgOrder = orders.reduce((s,o)=>s+Number(o.total),0) / orders.length;
  const byDay = {};
  const byHour = Array(24).fill(0);
  const byCustomer = {};
  orders.forEach(o => {
    const d = new Date(o.created_at);
    const day = d.toLocaleDateString([], { weekday: 'long' });
    byDay[day] = (byDay[day]||0) + Number(o.total);
    byHour[d.getHours()] += 1;
    const cust = o.customer_id;
    byCustomer[cust] = (byCustomer[cust]||0) + 1;
  });
  const bestDay = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  const worstDay = Object.entries(byDay).sort((a,b)=>a[1]-b[1])[0];
  const peakHourIdx = byHour.indexOf(Math.max(...byHour));
  const quietHourIdx = byHour.findIndex((v,i) => v === Math.min(...byHour.filter((x,j)=>byHour[j]>0 || true)) );
  const repeatCustomers = Object.values(byCustomer).filter(c=>c>1).length;
  const totalCustomers = Object.keys(byCustomer).length;
  const repeatRate = totalCustomers ? Math.round(repeatCustomers/totalCustomers*100) : 0;

  const productCounts = {};
  orders.forEach(o => (o.order_items||[]).forEach(oi => productCounts[oi.product_name] = (productCounts[oi.product_name]||0) + oi.quantity));
  const topProducts = Object.entries(productCounts).sort((a,b)=>b[1]-a[1]);
  const slowProduct = topProducts[topProducts.length-1];

  const recommendations = [];
  if (worstDay && bestDay && worstDay[0] !== bestDay[0]) recommendations.push(`${worstDay[0]}s are your slowest — consider a small promo or drop that day to even out demand.`);
  if (topProducts[0]) recommendations.push(`${topProducts[0][0]} is your best seller — feature it prominently or bundle it with slower items.`);
  if (slowProduct && topProducts.length > 3) recommendations.push(`${slowProduct[0]} sells the least — consider a limited-time discount to move it, or retire it.`);
  if (repeatRate < 30 && totalCustomers >= 5) recommendations.push(`Only ${repeatRate}% of customers have ordered more than once — a loyalty mission or gift milestone could help bring them back.`);
  if (peakHourIdx >= 0) recommendations.push(`Your busiest hour is around ${peakHourIdx}:00 — make sure pickup slots have enough capacity then.`);

  const hr=new Date().getHours(); const greet = hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  return `
    <div style="margin:4px 0 16px"><div class="meta">${new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}</div><div class="display" style="font-size:24px;margin-top:2px">${greet}, ${esc((state.profile?.full_name||'').split(' ')[0]||'there')}</div></div>
    <div class="stat-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      ${statCard('Avg Order Value', money(avgOrder))}
      ${statCard('Repeat Customer Rate', repeatRate+'%')}
      ${statCard('Best Day', bestDay?bestDay[0]:'—')}
      ${statCard('Peak Hour', peakHourIdx>=0?peakHourIdx+':00':'—')}
    </div>
    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="margin:0 0 12px;font-size:14px">Orders by Hour</h3>
      <div style="display:flex;align-items:flex-end;gap:2px;height:70px">
        ${byHour.map((v,i)=>`<div style="flex:1;background:${i===peakHourIdx?'var(--caramel-dark)':'var(--caramel-light)'};border-radius:2px 2px 0 0;height:${v?Math.max(4,v/Math.max(...byHour)*60):2}px" title="${i}:00 — ${v} orders"></div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--coffee-500);margin-top:4px"><span>12am</span><span>12pm</span><span>11pm</span></div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="margin:0 0 10px;font-size:14px">💡 Recommendations</h3>
      ${recommendations.length ? recommendations.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--coffee-700)">${esc(r)}</div>`).join('') : `<div style="font-size:13px;color:var(--coffee-500)">Not enough data yet for recommendations.</div>`}
    </div>`;
}

async function uploadProductImage(file){
  const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg';
  const path = `products/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const resp = await doFetch(`${SUPABASE_URL}/storage/v1/object/product-images/${path}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${state.session.access_token}`, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'true' },
    body: file,
  });
  if (!resp.ok) { const j = await parseJsonSafe(resp); throw new Error((j && (j.message || j.error)) || 'Upload failed'); }
  return `${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`;
}
async function handleProductImageChange(input){
  const file = input.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Please choose an image file', 'err'); return; }
  if (file.size > 8 * 1024 * 1024) { showToast('Image must be under 8MB', 'err'); return; }
  const spinner = document.getElementById('pe-upload-spinner');
  const wrap = document.getElementById('pe-img-preview-wrap');
  if (spinner) spinner.style.display = 'flex';
  try {
    const url = await uploadProductImage(file);
    document.getElementById('pe-img').value = url;
    state.adminEditProduct.image_url = url;
    if (wrap) { wrap.style.background = `url('${url}') center/cover`; wrap.querySelector('span')?.remove(); }
    showToast('Photo uploaded', 'ok');
  } catch (e) { showToast('Upload failed: ' + e.message, 'err'); }
  finally { if (spinner) spinner.style.display = 'none'; }
}
function clearProductImage(){
  document.getElementById('pe-img').value = ''; delete _typed['pe-img'];

function armDelete(btn, fn){
  if (btn.dataset.armed) { fn(); return; }
  btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = old === '✕' ? 'Sure?' : 'Tap again to delete';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);

async function saveAdminProduct(keepOpen){
  const btn = document.getElementById('pe-save-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = `<div class="spinner" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></div>`; }
  const payload = {
    name: document.getElementById('pe-name').value.trim(),
    description: document.getElementById('pe-desc').value.trim(),
    category_id: document.getElementById('pe-cat').value,
    base_price: Number(document.getElementById('pe-price').value)||0,
    image_url: document.getElementById('pe-img').value.trim(),
    is_available: document.getElementById('pe-avail').checked,
    is_featured: document.getElementById('pe-feat').checked,
    is_hot: document.getElementById('pe-hot').checked,
    is_iced: document.getElementById('pe-iced').checked,
  };
  if (!payload.name) { showToast('Please enter a name', 'err'); if (btn) { btn.disabled=false; btn.textContent='Save Product'; } return; }
  const id = state.adminEditProduct.id;
  const { data: savedRows, error } = id ? await sb.from('products').update(payload).eq('id', id).select() : await sb.from('products').insert(payload).select();
  if (error) { showToast(error.message, 'err'); if (btn) { btn.disabled=false; btn.textContent='Save Product'; } return; }
  if (keepOpen && savedRows && savedRows[0]) {
    Object.assign(state.adminEditProduct, savedRows[0], { product_option_groups: [], product_sizes: [] });
    if (btn) { btn.disabled=false; btn.textContent='Save Product'; }
    await refreshProducts(); refreshOptionsSection(); showToast('Item saved — now add its options', 'ok'); return;
  }
  closeAdminEditor(); await refreshProducts(); showToast('Saved','ok'); render();
}

async function openCustomerProfile(id){

  setState({ customerProfile: { id, loading: true } });
  const [pr, ords, favs, revs, email, push, lt] = await Promise.all([
    sb.from('profiles').select('*').eq('id', id).maybeSingle(),
    sb.from('orders').select('*, order_items(*, order_item_options(*))').eq('customer_id', id).order('created_at', { ascending: false }),
    sb.from('favorites').select('product_id').eq('customer_id', id),
    sb.from('reviews').select('*').eq('customer_id', id).order('created_at', { ascending: false }),
    sb.rpc('admin_get_user_email', { p_user_id: id }),

async function adjustPointsUI(uid){
  const amt = parseInt(document.getElementById('adj-amt')?.value, 10), reason = (document.getElementById('adj-reason')?.value || '').trim();
  if (!amt || amt < 1) return showToast('Enter a points amount', 'err');
  if (!reason) return showToast('Please add a reason', 'err');
  const delta = state.adjMode === 'remove' ? -amt : amt;
  if (!confirm(`${delta>0?'Add':'Remove'} ${amt} points?\nReason: ${reason}`)) return;
  const { data, error } = await sb.rpc('admin_adjust_points', { p_user_id: uid, p_delta: delta, p_reason: reason });
  if (error) return showToast(error.message, 'err');
  forgetTyped && forgetTyped('adj-amt'); forgetTyped && forgetTyped('adj-reason');
  showToast(`Done — new balance ${data} pts`, 'ok');
  state.adjMode = 'add'; openCustomerProfile(uid);
}
