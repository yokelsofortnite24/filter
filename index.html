<script>
// Bumped on every real deploy. Lets a running tab/installed PWA detect a
// newer version is live on the server and prompt to refresh, instead of
// silently running stale code forever (a common PWA gotcha).
const APP_BUILD = '2026-10-10-11';

// ---------------------------------------------------------------
// Minimal self-contained Supabase client (REST + Auth over fetch).
// We avoid loading the official supabase-js SDK from an external CDN
// since this sandbox only allows scripts from cdnjs.cloudflare.com,
// which does not host it. This shim talks directly to Supabase's
// PostgREST + GoTrue HTTP APIs, which is all supabase-js does anyway.
// ---------------------------------------------------------------
function authHeaders(extra){
  return Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${state.session?.access_token || SUPABASE_KEY}`,
    'Content-Type': 'application/json',
  }, extra || {});
}
async function parseJsonSafe(resp){ try { return await resp.json(); } catch(e){ return null; } }

// ---- request activity indicator ----
let _pending = 0;
// Background work (polling, update checks) runs inside _bgDepth>0 and never
// shows the bar. User-started loads only show it if they take >400ms.
let _bgDepth = 0, _loadbarTimer = null, _loadbarShown = false;
function beginRequest(bg){ if (bg) return; _pending++; updateLoadbar(); }
function endRequest(bg){ if (bg) return; _pending = Math.max(0, _pending-1); updateLoadbar(); }
function updateLoadbar(){
  const bar = document.getElementById('loadbar'); if (!bar) return;
  if (_pending > 0) {
    if (!_loadbarShown && !_loadbarTimer) _loadbarTimer = setTimeout(() => { _loadbarTimer = null; if (_pending > 0) { _loadbarShown = true; bar.style.opacity = '1'; bar.style.width = '70%'; } }, 400);
  } else {
    clearTimeout(_loadbarTimer); _loadbarTimer = null;
    if (_loadbarShown) { _loadbarShown = false; bar.style.width = '100%'; setTimeout(()=>{ if(_pending===0){ bar.style.opacity='0'; bar.style.width='0%'; } }, 200); }
  }
}

// ---- session persistence (this app runs on its own real domain now, so
// normal browser storage is safe and is how "stay signed in" actually works) ----
const SESSION_STORAGE_KEY = 'filter_auth_session';
function saveSessionToStorage(session){
  try { localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session)); } catch (e) { /* storage unavailable — session just won't persist */ }
}
function loadSessionFromStorage(){
  try { const raw = localStorage.getItem(SESSION_STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function clearSessionFromStorage(){
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) { /* ignore */ }
}

// ---- session refresh (keeps the user signed in) ----
let _refreshTimer = null;
function scheduleRefresh(session){
  clearTimeout(_refreshTimer);
  if (!session?.refresh_token || !session?.expires_in) return;
  const ms = Math.max((session.expires_in - 90) * 1000, 15000);
  _refreshTimer = setTimeout(refreshSession, ms);
}
async function refreshSession(){
  if (!state.session?.refresh_token) return false;
  try {
    const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ refresh_token: state.session.refresh_token }) });
    const json = await parseJsonSafe(resp);
    if (!resp.ok || !json?.access_token) { clearSessionFromStorage(); return false; }
    state.session = json;
    saveSessionToStorage(json);
    scheduleRefresh(json);
    return true;
  } catch (e) { return false; }
}
async function doFetch(url, opts){
  const bg = _bgDepth > 0;
  beginRequest(bg);
  try {
    let resp = await fetch(url, opts);
    if (resp.status === 401 && state.session?.refresh_token) {
      const ok = await refreshSession();
      if (ok) {
        opts.headers = Object.assign({}, opts.headers, { 'Authorization': `Bearer ${state.session.access_token}` });
        resp = await fetch(url, opts);
      }
    }
    return resp;
  } finally { endRequest(bg); }
}

function fromTable(table){
  const q = { selectCols: '*', filters: [], orderCol: null, orderAsc: true, limitN: null, method: 'GET', body: null, single: null };
  const builder = {
    select(cols){ q.selectCols = cols || '*'; return builder; },
    eq(col, val){ q.filters.push(`${col}=eq.${encodeURIComponent(val)}`); return builder; },
    in(col, vals){ q.filters.push(`${col}=in.(${(vals||[]).map(v=>encodeURIComponent('"'+String(v).replace(/"/g,'\\"')+'"')).join(',')})`); return builder; },
    order(col, opts){ q.orderCol = col; q.orderAsc = !(opts && opts.ascending === false); return builder; },
    limit(n){ q.limitN = n; return builder; },
    insert(payload){ q.method = 'POST'; q.body = payload; return builder; },
    update(payload){ q.method = 'PATCH'; q.body = payload; return builder; },
    delete(){ q.method = 'DELETE'; return builder; },
    maybeSingle(){ q.single = 'maybe'; return exec(); },
    single(){ q.single = true; return exec(); },
    then(resolve, reject){ return exec().then(resolve, reject); },
  };
  async function exec(){
    let url = `${SUPABASE_URL}/rest/v1/${table}?select=${encodeURIComponent(q.selectCols)}`;
    if (q.filters.length) url += '&' + q.filters.join('&');
    if (q.orderCol) url += `&order=${q.orderCol}.${q.orderAsc ? 'asc' : 'desc'}`;
    if (q.limitN) url += `&limit=${q.limitN}`;
    const headers = authHeaders(q.method !== 'GET' ? { 'Prefer': 'return=representation' } : {});
    let resp;
    try {
      resp = await doFetch(url, { method: q.method, headers, cache: 'no-store', body: q.body !== null ? JSON.stringify(q.body) : undefined });
    } catch (e) { return { data: null, error: { message: 'Network error: ' + e.message } }; }
    const json = await parseJsonSafe(resp);
    if (!resp.ok) return { data: null, error: { message: (json && (json.message || json.error_description || json.msg || json.hint)) || resp.statusText || 'Request failed' } };
    // An UPDATE that RLS blocks returns 200 with zero rows — that used to look
    // like a successful save even though nothing changed for customers.
    if (q.method === 'PATCH' && Array.isArray(json) && json.length === 0) return { data: null, error: { message: "Not saved — your account doesn't have permission to change this (check that you're signed in as admin)." } };
    if (q.single === true) return { data: Array.isArray(json) ? json[0] : json, error: null };
    if (q.single === 'maybe') return { data: Array.isArray(json) ? (json[0] || null) : json, error: null };
    return { data: json, error: null };
  }
  return builder;
}
async function rpcCall(fn, params){
  try {
    const resp = await doFetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', cache: 'no-store', headers: authHeaders(), body: JSON.stringify(params || {}) });
    const json = await parseJsonSafe(resp);
    if (!resp.ok) return { data: null, error: { message: (json && (json.message || json.hint || json.error_description)) || resp.statusText || 'Request failed' } };
    return { data: json, error: null };
  } catch (e) { return { data: null, error: { message: 'Network error: ' + e.message } }; }
}
const sb = {

        if (!resp.ok) return { data: null, error: { message: (json && (json.msg || json.error_description || json.message)) || 'Sign up failed' } };
        if (json && json.access_token) return { data: { session: json, user: json.user }, error: null };

        const json = await parseJsonSafe(resp);

      } catch (e) { return { data: null, error: { message: 'Network error: ' + e.message } }; }
    },
    async signOut(){ return { error: null }; },
  },
};

async function registerServiceWorker(){
  if (!('serviceWorker' in navigator)) return null;
  try {
    swRegistration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
    try { swRegistration.update(); } catch(e){}
    if (!window.__swReloadHooked) { window.__swReloadHooked = true; let had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) location.reload(); had = true; }); }
    return swRegistration;
  }
  catch (e) { return null; }
}
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && window.isSecureContext;
}
async function currentPushSubscription(){
  if (!swRegistration) return null;
  try { return await swRegistration.pushManager.getSubscription(); } catch (e) { return null; }
}
async function enablePushNotifications(){
  if (!pushSupported()) { showToast("This browser/tab can't receive push notifications. Try installing Filter to your home screen first.", 'err'); return; }
  if (!swRegistration) await registerServiceWorker();
  if (!swRegistration) { showToast('Could not start the notification service.', 'err'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { showToast('Notifications permission was not granted.', 'err'); return; }
  try {
    const sub = await swRegistration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    const json = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').insert({
      user_id: state.session.user.id, endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth, user_agent: navigator.userAgent,
    });
    if (error && !error.message.includes('duplicate')) { showToast(error.message, 'err'); return; }
    state.pushEnabled = true;
    showToast("Notifications enabled — you'll get real alerts on this device.", 'ok');
    render();
  } catch (e) { showToast('Could not enable notifications: ' + e.message, 'err'); }
}
async function disablePushNotifications(){
  const sub = await currentPushSubscription();
  if (sub) {
    await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);

  }
  state.pushEnabled = false;

}

// True while the person is actively typing/selecting somewhere — a background

function isEditingSomething(){
  const el = document.activeElement;

}

function startPolling(){

  // instant the person comes back so they never look at stale data.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollTick(); });
  window.addEventListener('focus', () => pollTick());
}

// A customizer/sheet the person is using is never rebuilt by background data;
// it picks up fresh data the next time they interact.
function modalInUse(){ return !!(state.customerProfile || state.productModal || state.checkoutOpen || state.cartOpen || state.reviewModal || state.chatOpen || state.membershipCardOpen || state.orderDetailId || state.iosInstallModal || state.adminMoreOpen); }
async function pollTick(){
    if (_polling) return;
    if (!state.session || !state.profile) return;
    _polling = true;
    _bgDepth++;
    const _sigBefore = pollSignature();
    try {
      // Keep the menu, categories, prices, availability, promos and rewards in
      // sync for EVERYONE signed in — so an admin's edit shows up for an
      // already-open customer session without them needing to reload.
      await loadPublicData();

      if (state.profile.role === 'customer') {
        const prevStatus = Object.fromEntries(state.orders.map(o => [o.id, o.status]));
        const prevPoints = state.profile.loyalty_points;
        const prevGiftCount = (state.myGifts||[]).length;
        await loadOrders();
        const statusChanges = state.orders.filter(o => prevStatus[o.id] && prevStatus[o.id] !== o.status);
        await Promise.all([loadNotifications(), loadMyGifts()]);
        const { data: freshProfile } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
        let pointsGained = 0;
        if (freshProfile) {
          if (prevPoints != null && freshProfile.loyalty_points > prevPoints) pointsGained = freshProfile.loyalty_points - prevPoints;
          state.profile = freshProfile;
        }
        const giftUnlocked = (state.myGifts||[]).length > prevGiftCount;

        if (isEditingSomething()) return; // data is fresh in state; screen updates next safe render
        statusChanges.forEach(o => showToast(`Order #${o.order_number} is now ${o.status}`));
        if (pointsGained > 0) showToast(`+${pointsGained} loyalty points earned!`, 'ok');
        if (giftUnlocked) showToast('🎁 You unlocked a free gift! Check Rewards.', 'ok');
        if (pollSignature() !== _sigBefore && !modalInUse()) render();
      } else if (state.profile.role === 'worker' || state.profile.role === 'admin') {
        const prevCount = state.workerOrders.length;
        await Promise.all([loadWorkerOrders(), loadNotifications()]);
        const newOrderArrived = state.workerOrders.length > prevCount;

        if (isEditingSomething()) return; // never wipe an in-progress edit (settings, product form, etc.)
        if (newOrderArrived) showToast('New order received');
        if (pollSignature() !== _sigBefore && !modalInUse()) render();
      }
    } catch (e) { /* silent — retry on next tick */ }
    finally { _polling = false; _bgDepth = Math.max(0, _bgDepth - 1); }
}

// ---------------- CART ----------------
function cartKey(item){ return item.product_id + '|' + item.size_name + '|' + item.choices.map(c=>c.name).sort().join(',') + '|' + item.notes; }
function addToCart(item){
  const existing = state.cart.find(c => cartKey(c) === cartKey(item));
  if (existing) existing.qty += item.qty; else state.cart.push(item);
  setState({ productModal: null }); showToast('Added to cart');
}
function removeFromCart(idx){ state.cart.splice(idx,1); render(); }
function cartLineTotal(item){ return (item.unit_price) * item.qty; }
function cartSubtotal(){ return state.cart.reduce((s,i)=>s+cartLineTotal(i),0); }

// ---------------- ORDER PLACEMENT ----------------
async function placeOrder({ pickupDate, pickupTime, notes }){
  const subtotal = cartSubtotal();
  const taxRate = Number(state.settings?.tax_rate || 0);
  let discount = 0, promoId = null;
  if (state.promoResult) { discount += Number(state.promoResult.calculated_discount); promoId = state.promoResult.promo_id; }
  const loyaltyDiscount = state.redeemPoints * Number(state.settings?.loyalty_point_value || 0.01);
  discount += loyaltyDiscount;
  const taxable = Math.max(subtotal - discount, 0);
  const tax = +(taxable * taxRate).toFixed(2);
  const total = +(taxable + tax).toFixed(2);
  const pointsEarned = Math.floor(total * Number(state.settings?.loyalty_points_per_currency || 1));

  const { data: order, error } = await sb.from('orders').insert({
    customer_id: state.session.user.id, status: 'pending', fulfillment_type: 'pickup',
    pickup_date: pickupDate, pickup_time: pickupTime, subtotal, discount_amount: +discount.toFixed(2),
    tax_amount: tax, total, loyalty_points_redeemed: state.redeemPoints, loyalty_discount_amount: +loyaltyDiscount.toFixed(2),
    loyalty_points_earned: pointsEarned, promo_id: promoId, special_instructions: notes,
  }).select().single();
  if (error) { showToast('Order failed: ' + error.message, 'err'); return null; }

  let itemsFailed = false;
  for (const item of state.cart) {
    const { data: oi, error: oiErr } = await sb.from('order_items').insert({
      order_id: order.id, product_id: item.product_id, product_name: item.name, size_name: item.size_name,
      size_price_modifier: item.size_mod, unit_price: item.unit_price, quantity: item.qty,
      line_total: cartLineTotal(item), special_instructions: item.notes,
    }).select().single();
    if (oiErr) { itemsFailed = true; showToast('Some items failed to save: ' + oiErr.message, 'err'); continue; }
    if (item.choices.length) {
      const { error: optErr } = await sb.from('order_item_options').insert(item.choices.map(c => ({ order_item_id: oi.id, choice_name: c.name, price_modifier: c.price_modifier })));
      if (optErr) itemsFailed = true;
    }
  }
  if (itemsFailed) showToast(`Order #${order.order_number} was created but some details didn't save — please tell staff or call ${state.settings?.support_phone || ''}`, 'err');
  if (state.redeemPoints > 0) await sb.rpc('redeem_points_for_order', { p_order_id: order.id, p_points: state.redeemPoints });
  if (promoId) await sb.rpc('record_promo_redemption', { p_order_id: order.id, p_promo_id: promoId });

  await loadProfile();
  setState({ cart: [], checkoutOpen: false, promoCode: '', promoResult: null, redeemPoints: 0, view: 'customer', tab: 'orders' });
  showToast(`Order #${order.order_number} placed! 🎉`, 'ok');
  return order;
}

// ---------------- RENDER ROOT ----------------
let _modalWasOpen = {};
function justOpened(key, isOpenNow){
  const was = !!_modalWasOpen[key];
  _modalWasOpen[key] = !!isOpenNow;
  return !!isOpenNow && !was;
}
let _lastTab = null;
function tabJustChanged(tab){
  const changed = tab !== _lastTab;
  _lastTab = tab;
  return changed;
}
function render(){
  if (state.view === 'loading') { root.innerHTML = `<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px"><div class="spinner" style="width:32px;height:32px;border-width:3px"></div><div class="display" style="font-size:22px;color:var(--coffee-700)">Filter</div></div>`; return; }
  let html = '';
  if (state.view === 'auth') html = renderAuth();
  else if (state.view === 'customer') html = renderCustomer() + renderChatBubble();
  else if (state.view === 'worker') html = renderWorker();
  else if (state.view === 'admin') html = renderAdmin();
  if (state.toasts.length) html += `<div class="toast-stack">${state.toasts.map(t=>`<div class="toast ${t.type==='err'?'err':t.type==='ok'?'ok':''} ${justOpened('toast:'+t.id, true)?'':'no-anim'}">${esc(t.msg)}</div>`).join('')}</div>`;
  if (state.productModal) html += renderProductModal(justOpened('product', true)); else justOpened('product', false);
  if (state.cartOpen) html += renderCartSheet(justOpened('cart', true)); else justOpened('cart', false);
  if (state.checkoutOpen) html += renderCheckoutSheet(justOpened('checkout', true)); else justOpened('checkout', false);
  if (state.customerProfile) html += renderCustomerProfileSheet(justOpened('custProfile', true)); else justOpened('custProfile', false);
  if (state.orderDetailId) html += renderOrderDetailSheet(justOpened('orderDetail', true)); else justOpened('orderDetail', false);
  if (state.reviewModal) html += renderReviewModal(justOpened('review', true)); else justOpened('review', false);
  if (state.iosInstallModal) html += renderIosInstallModal(justOpened('ios', true)); else justOpened('ios', false);
  if (state.chatOpen) html += renderChatSheet(justOpened('chat', true)); else justOpened('chat', false);
  if (state.membershipCardOpen) html += renderMembershipCardModal(justOpened('membership', true)); else justOpened('membership', false);
  if (shouldShowIosHint()) html += `<div class="ios-hint" role="status"><span style="font-size:22px">📲</span><div style="flex:1">Install Filter: tap <b>Share</b> ⬆️ then <b>Add to Home Screen</b>.</div><button class="btn" style="background:transparent;color:var(--cream-2);min-width:44px;padding:0 6px" aria-label="Dismiss" onclick="dismissIosHint()">✕</button></div>`;
  if (state.updateAvailable) html += `<div style="position:fixed;bottom:0;left:0;right:0;background:var(--coffee-900);color:var(--cream-2);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:150;box-shadow:0 -8px 24px -8px rgba(0,0,0,.3)">
    <span style="font-size:13px;font-weight:600">🔄 A newer version is ready</span>
    <button class="btn btn-primary" style="padding:9px 16px;font-size:13px;white-space:nowrap" onclick="reloadForUpdate()">Update Now</button>
  </div>`;
  const active = document.activeElement;
  const activeId = active && active.id && root.contains(active) ? active.id : null;
  let selStart = null, selEnd = null;
  try { if (activeId) { selStart = active.selectionStart; selEnd = active.selectionEnd; } } catch (e) {}
  const scrolls = captureScrolls();
  root.innerHTML = html;
  restoreTypedValues(activeId, selStart, selEnd);
  restoreScrolls(scrolls);
}
// ---- Scroll protection: every scrolled container (chip rows, sheets, lists)
// and the page keep their position across re-renders. Containers are keyed by
// id if they have one, else by their position in the DOM tree.
function _domKey(el){
  if (el.id) return '#' + el.id;
  const parts = [];
  while (el && el !== root) { const par = el.parentElement; if (!par) break; parts.unshift(Array.prototype.indexOf.call(par.children, el) + ':' + el.tagName); el = par; }
  return parts.join('/');
}
function captureScrolls(){
  const out = { win: [window.scrollX, window.scrollY], els: {} };
  root.querySelectorAll('*').forEach(el => { if (el.scrollLeft || el.scrollTop) out.els[_domKey(el)] = [el.scrollLeft, el.scrollTop]; });
  return out;
}
function restoreScrolls(s){
  Object.entries(s.els).forEach(([k, [x, y]]) => {
    const el = k[0] === '#' ? document.getElementById(k.slice(1)) : _byKey(k);
    if (el) { el.scrollLeft = x; el.scrollTop = y; }
  });
  if (window.scrollX !== s.win[0] || window.scrollY !== s.win[1]) window.scrollTo(s.win[0], s.win[1]);
}
function _byKey(k){
  let el = root;
  for (const part of k.split('/')) { const [i, tag] = part.split(':'); el = el && el.children[Number(i)]; if (!el || el.tagName !== tag) return null; }
  return el;
}
// ---- Form protection: ANY re-render (polling, toasts, button taps) used to
// rebuild inputs from state and wipe what the person had typed. We remember
// every value the person types (by element id) and put it back after each
// render. An entry is forgotten as soon as its field leaves the screen
// (form saved/closed, tab changed), so fresh data shows next time.
const _typed = {};
function _rememberTyped(e){
  const el = e.target;
  if (!el || !el.id || !root.contains(el)) return;
  if (!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.type === 'file') return;
  _typed[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? { checked: el.checked } : { value: el.value };
}
document.addEventListener('input', _rememberTyped, true);
document.addEventListener('change', _rememberTyped, true);
function forgetTyped(prefix){ Object.keys(_typed).forEach(k => { if (!prefix || k.startsWith(prefix)) delete _typed[k]; }); }
function restoreTypedValues(activeId, selStart, selEnd){
  Object.keys(_typed).forEach(id => {
    const el = document.getElementById(id);
    if (!el) { delete _typed[id]; return; }
    const v = _typed[id];
    if ('checked' in v) el.checked = v.checked; else if (el.value !== v.value) el.value = v.value;
  });
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && document.activeElement !== el) {
      try { el.focus({ preventScroll: true }); if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch (e) {}
    }
  }
}

async function registerStaffWithCode(){
  const full_name = document.getElementById('sr-name').value.trim();
  const email = document.getElementById('sr-email').value.trim();
  const password = document.getElementById('sr-pass').value;
  const role = document.getElementById('sr-role').value;
  const code = document.getElementById('sr-code').value.trim();
  if (!full_name || !email || !password || !code) { state.authError = 'Please fill in every field'; return render(); }
  if (password.length < 6) { state.authError = 'Password must be at least 6 characters'; return render(); }
  state.authBusy = true; state.authError = ''; render();
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/register-staff-with-code`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, full_name, role, code }),
    });
    const json = await parseJsonSafe(resp);
    state.authBusy = false;
    if (!resp.ok) { state.authError = json?.error || 'Could not create account'; return render(); }
    showToast('Account created — sign in below', 'ok');
    setState({ authMode: 'staff' });
  } catch (e) { state.authBusy = false; state.authError = 'Network error: ' + e.message; render(); }
}
function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('af-email').value.trim();
  const pass = document.getElementById('af-pass').value;
  state._afEmail = email;
  if (state.authMode === 'signup') { const name = document.getElementById('af-name').value.trim(); state._afName = name; signUp(email, pass, name); }
  else signIn(email, pass);
  return false;
}

function unreadCount(){ return state.notifications.filter(n=>!n.is_read).length; }

async function markAllNotificationsRead(){
  const unread = state.notifications.filter(n=>!n.is_read);
  if (!unread.length) return;
  state.notifications.forEach(n=>n.is_read=true); render();
  await Promise.all(unread.map(n=>sb.from('notifications').update({ is_read: true }).eq('id', n.id)));
}

function productEmoji(p){
  const tags = (p.tags||[]).join(' ').toLowerCase();
  const name = (p.name||'').toLowerCase();
  if (tags.includes('tea') || name.includes('tea') || name.includes('chai')) return p.is_iced ? '🧊' : '🍵';
  if (tags.includes('chocolate') || name.includes('chocolate')) return '🍫';
  if (tags.includes('bakery')) return '🥐';
  if (p.is_iced) return '🧊';
  return '☕';
}
function filteredProducts(){
  return state.products.filter(p=>{
    if (state.activeCategory!=='all' && p.category_id!==state.activeCategory) return false;
    if (state.search && !p.name.toLowerCase().includes(state.search.toLowerCase()) && !(p.description||'').toLowerCase().includes(state.search.toLowerCase())) return false;
    if (state.filters.hot && !p.is_hot) return false;
    if (state.filters.iced && !p.is_iced) return false;
    return true;
  });
}
// ---- v11 helpers: shop status, live order, order again, share ----
function fmtTime12(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'pm':'am'; const hh=((h+11)%12)+1; return m?`${hh}:${String(m).padStart(2,'0')}${ap}`:`${hh}${ap}`; }
function shopStatus(){
  const st=state.settings||{}; const o=(st.open_time||'07:00').slice(0,5), c=(st.close_time||'19:00').slice(0,5);
  const d=new Date(); const now=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const hours=`${fmtTime12(o)} – ${fmtTime12(c)}`;
  if (st.is_accepting_orders===false) return {open:false, text:'Not taking orders right now', hours};
  const inHours = o<=c ? (now>=o && now<c) : (now>=o || now<c);
  if (inHours) return {open:true, text:`Open now · until ${fmtTime12(c)}`, hours};
  return {open:false, text:`Closed · opens ${fmtTime12(o)}`, hours};
}
function renderShopStatus(){
  const s=shopStatus();
  return `<div class="shop-status ${s.open?'open':'closed'}"><span class="dot"></span><b>${s.text}</b><span class="meta" style="margin-left:auto;white-space:nowrap">Today ${s.hours}</span></div>`;
}
function liveOrder(){ const cut=Date.now()-18*3600000; return (state.orders||[]).find(o=>['pending','accepted','preparing','ready'].includes(o.status) && new Date(o.created_at).getTime()>cut); }
function renderLiveOrderBanner(){
  const o=liveOrder(); if(!o) return '';
  const steps={pending:['Order received',"We'll confirm it shortly",1],accepted:['Order confirmed',"We'll start it soon",2],preparing:['Being made now','Almost there',3],ready:['Your order is ready!','Come pick it up at the counter',4]};
  const [t,sub,n]=steps[o.status];
  return `<div class="live-order ${o.status==='ready'?'ready':''}" onclick="setState({orderDetailId:'${o.id}'})">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div class="lo-kicker">Order #${o.order_number}${o.pickup_time?' · pickup '+fmtTime12(o.pickup_time.slice(0,5)):''}</div><div class="lo-title">${t}</div><div class="lo-sub">${sub}</div></div><div style="font-size:28px">${o.status==='ready'?'🛎️':'☕'}</div></div>
    <div class="lo-steps">${[1,2,3,4].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>
  </div>`;
}
function renderOrderAgain(){
  if (liveOrder()) return '';
  const o=(state.orders||[]).find(x=>x.status==='completed' && (x.order_items||[]).length); if(!o) return '';
  const items=o.order_items.map(i=>`${i.quantity}× ${i.product_name}`).join(', ');
  return `<div class="card order-again"><div style="flex:1;min-width:0"><div class="lo-kicker" style="color:var(--caramel-dark);opacity:1">Order again</div><div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(items)}</div><div class="meta">${money(o.total)} · last on ${new Date(o.created_at).toLocaleDateString([],{day:'numeric',month:'short'})}</div></div><button class="btn btn-primary btn-sm" onclick="reorder('${o.id}')">Add to cart</button></div>`;
}
function orderSummaryText(o){
  const lines=(o.order_items||[]).map(i=>`• ${i.quantity}× ${i.product_name}${i.size_name?' ('+i.size_name+')':''} — ${money(i.line_total ?? i.unit_price*i.quantity)}`);
  return `${state.settings?.business_name||'Filter'} — Order #${o.order_number}\n${o.profiles?.full_name?'For: '+o.profiles.full_name+'\n':''}Pickup: ${o.pickup_date||''} ${o.pickup_time?fmtTime12(o.pickup_time.slice(0,5)):''}\n\n${lines.join('\n')}\n\nTotal: ${money(o.total)} (${o.payment_confirmed?'paid':'payment pending'})\nStatus: ${o.status}${o.special_instructions?'\nNotes: '+o.special_instructions:''}`;
}
function waNumber(ph){ let d=String(ph||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('0')) d='92'+d.slice(1); return d; }
function findAnyOrder(id){ return state.workerOrders.find(x=>x.id===id)||state.orders.find(x=>x.id===id)||(state.customerProfile?.orders||[]).find(x=>x.id===id); }
function shareOrderWhatsApp(id){ const o=findAnyOrder(id); if(!o) return; const n=waNumber(o.profiles?.phone); window.open(`https://wa.me/${n}?text=${encodeURIComponent(orderSummaryText(o))}`,'_blank'); }
async function copyOrderSummary(id){ const o=findAnyOrder(id); if(!o) return; const t=orderSummaryText(o); try{ if(navigator.share){ await navigator.share({title:'Order #'+o.order_number,text:t}); return; } await navigator.clipboard.writeText(t); showToast('Order summary copied','ok'); }catch(e){ if(e&&e.name!=='AbortError') showToast('Could not share','err'); } }

  const featured = state.products.filter(p=>p.is_featured && p.is_available);

      <div style="flex:1"><div style="font-size:11px;color:var(--caramel-dark);font-weight:700">JUST FOR YOU</div><div style="font-size:13.5px;font-weight:700">Order your usual: ${esc(recommendation.name)}?</div></div>

    <input class="input" placeholder="Search drinks..." value="${esc(state.search)}" oninput="state.search=this.value; renderMenuInPlace()" style="margin-bottom:14px">

function renderDropBanner(drop){
  const msLeft = new Date(drop.ends_at) - new Date();
  const hrs = Math.floor(msLeft / 3600000);
  const mins = Math.floor((msLeft % 3600000) / 60000);
  return `<div class="card" style="padding:16px;margin-bottom:16px;background:linear-gradient(135deg,var(--caramel-dark),var(--coffee-900));color:var(--cream-2)">
    <div style="font-size:11px;font-weight:700;letter-spacing:.04em;opacity:.85;margin-bottom:4px">⚡ LIMITED-TIME DROP</div>
    <div style="font-size:15px;font-weight:700;margin-bottom:4px">${esc(drop.code)} — ${esc(drop.description||'')}</div>
    <div style="font-size:12px;opacity:.85">Ends in ${hrs>0?hrs+'h ':''}${mins}m — use this code at checkout</div>
  </div>`;
}
window.renderMenuInPlace = function(){
  const grid = document.getElementById('menu-grid');
  if (grid) grid.innerHTML = filteredProducts().map(p=>renderProductCard(p)).join('') || `<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--coffee-500)">No drinks match.</div>`;
}

      <div style="display:flex;justify-content:space-between;align-items:center">

async function toggleFavorite(productId){
  if (state.favorites.has(productId)) {
    state.favorites.delete(productId);
    await sb.from('favorites').delete().eq('customer_id', state.session.user.id).eq('product_id', productId);
  } else {
    state.favorites.add(productId);
    await sb.from('favorites').insert({ customer_id: state.session.user.id, product_id: productId });
  }
  render();
}
function openProduct(id){
  const p = state.products.find(x=>x.id===id); if (!p) return;
  const sizes = (p.product_sizes||[]).sort((a,b)=>a.sort_order-b.sort_order);
  const defaultSize = sizes.find(s=>s.is_default) || sizes[0];
  setState({ productModal: { product: p, size: defaultSize?.id || null, choices: {}, qty: 1, notes: '' } });
}

// ================= PRODUCT MODAL =================
function renderProductModal(fresh){
  const m = state.productModal, p = m.product;
  const sizes = (p.product_sizes||[]).sort((a,b)=>a.sort_order-b.sort_order);
  const groups = (p.product_option_groups||[]).sort((a,b)=>a.sort_order-b.sort_order);
  const size = sizes.find(s=>s.id===m.size);
  let unit = Number(p.base_price) + Number(size?.price_modifier||0);
  let choiceObjs = [];
  groups.forEach(g=>{ const sel = m.choices[g.id]||[]; sel.forEach(cid=>{ const ch = g.product_option_choices.find(c=>c.id===cid); if(ch){ unit += Number(ch.price_modifier); choiceObjs.push(ch); }}); });
  const canAdd = groups.filter(g=>g.is_required).every(g=>(m.choices[g.id]||[]).length>0);
  return `<div class="scrim" onclick="if(event.target===this) closeModal()"><div class="sheet ${fresh?'':'no-anim'}">
    <div style="height:150px;border-radius:16px;background:linear-gradient(135deg,#EFE0C4,var(--caramel-light));display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:14px;overflow:hidden">${p.image_url?`<img src="${esc(p.image_url)}" style="width:100%;height:100%;object-fit:cover">`:'☕'}</div>
    <h2 class="display" style="margin:0 0 4px;font-size:22px">${esc(p.name)}</h2>
    <p style="color:var(--coffee-500);font-size:13.5px;margin:0 0 16px">${esc(p.description||'')}</p>

    ${sizes.length ? `<label class="small">Size</label><div class="scrollx" style="margin:8px 0 16px">
      ${sizes.map(s=>`<button class="chip ${m.size===s.id?'active':''}" onclick="state.productModal.size='${s.id}'; render()">${esc(s.name)}${s.price_modifier>0?` +${money(s.price_modifier)}`:''}</button>`).join('')}
    </div>` : ''}

    ${groups.map(g=>`
      <label class="small">${esc(g.name)}${g.is_required?' · Required':''}</label>
      <div class="scrollx" style="margin:8px 0 16px">
        ${g.product_option_choices.sort((a,b)=>a.sort_order-b.sort_order).map(c=>{
          const sel = (m.choices[g.id]||[]).includes(c.id);
          return `<button class="chip ${sel?'active':''}" onclick="selectChoice('${g.id}','${c.id}',${g.max_selections})">${esc(c.name)}${c.price_modifier>0?` +${money(c.price_modifier)}`:''}</button>`;
        }).join('')}
      </div>`).join('')}

    <label class="small">Special Instructions</label>
    <textarea class="input" style="margin:8px 0 16px;min-height:60px;resize:vertical" placeholder="e.g. extra hot, less ice..." oninput="state.productModal.notes=this.value">${esc(m.notes)}</textarea>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <label class="small">Quantity</label>
      <div style="display:flex;align-items:center;gap:14px">
        <button class="btn btn-ghost" style="width:44px;height:44px;padding:0;border-radius:50%" onclick="state.productModal.qty=Math.max(1,state.productModal.qty-1); render()">−</button>
        <span style="font-weight:700;font-size:16px;min-width:16px;text-align:center">${m.qty}</span>
        <button class="btn btn-ghost" style="width:44px;height:44px;padding:0;border-radius:50%" onclick="state.productModal.qty+=1; render()">+</button>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:2" ${canAdd?'':'disabled'} onclick="confirmAddToCart()">Add ${money(unit*m.qty)}</button>
    </div>
  </div></div>`;
}
function selectChoice(groupId, choiceId, max){
  const cur = state.productModal.choices[groupId] || [];
  if (max <= 1) state.productModal.choices[groupId] = cur.includes(choiceId) ? [] : [choiceId];
  else state.productModal.choices[groupId] = cur.includes(choiceId) ? cur.filter(x=>x!==choiceId) : (cur.length<max ? [...cur, choiceId] : cur);
  render();
}
function closeModal(){ setState({ productModal: null }); }
function confirmAddToCart(){
  const m = state.productModal, p = m.product;
  const sizes = (p.product_sizes||[]);
  const size = sizes.find(s=>s.id===m.size);
  const groups = (p.product_option_groups||[]);
  let unit = Number(p.base_price) + Number(size?.price_modifier||0);
  let choiceObjs = [];
  groups.forEach(g=>{ (m.choices[g.id]||[]).forEach(cid=>{ const ch = g.product_option_choices.find(c=>c.id===cid); if(ch){ unit += Number(ch.price_modifier); choiceObjs.push({ name: ch.name, price_modifier: Number(ch.price_modifier) }); }}); });
  addToCart({ product_id: p.id, name: p.name, size_name: size?.name||null, size_mod: Number(size?.price_modifier||0), unit_price: unit, choices: choiceObjs, qty: m.qty, notes: m.notes });
}

async function openCheckout(){
  setState({ cartOpen: false, checkoutOpen: true, slotLoads: {} });
  try {
    const today = new Date(); const tomorrow = new Date(); tomorrow.setDate(today.getDate()+1);
    const [r1, r2, r3] = await Promise.all([
      sb.rpc('get_slot_load', { p_date: localDateStr(today) }),
      sb.rpc('get_slot_load', { p_date: localDateStr(tomorrow) }),
      sb.from('payout_details').select('*').maybeSingle(),
    ]);
    const loads = {};
    (r1.data||[]).forEach(row => loads[`${localDateStr(today)}|${row.slot_time.slice(0,5)}`] = Number(row.order_count));
    (r2.data||[]).forEach(row => loads[`${localDateStr(tomorrow)}|${row.slot_time.slice(0,5)}`] = Number(row.order_count));
    state.slotLoads = loads;
    state.payoutDetails = r3.data || {};
    render();
  } catch (e) { /* non-critical — checkout still works without load data */ }
}
function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function pickupSlotOptions(){
  const open = state.settings?.open_time || '07:00', close = state.settings?.close_time || '19:00';
  const interval = state.settings?.pickup_slot_interval_minutes || 15;
  const buffer = state.settings?.order_prep_buffer_minutes || 5;
  const maxPerSlot = state.settings?.max_orders_per_slot || 4;
  const now = new Date();
  const slots = [];
  for (let d=0; d<2; d++){
    const date = new Date(now); date.setDate(now.getDate()+d);
    const dateStr = localDateStr(date);
    let [oh,om] = open.split(':').map(Number), [ch,cm] = close.split(':').map(Number);
    let cur = new Date(date); cur.setHours(oh,om,0,0);
    const end = new Date(date); end.setHours(ch,cm,0,0);
    const earliest = new Date(now.getTime() + buffer*60000);
    while (cur < end) {
      if (d>0 || cur >= earliest) {
        const timeStr = cur.toTimeString().slice(0,5);
        const load = (state.slotLoads||{})[`${dateStr}|${timeStr}`] || 0;
        slots.push({ date: dateStr, time: timeStr, label: `${d===0?'Today':'Tomorrow'} · ${cur.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`, load });
      }
      cur = new Date(cur.getTime() + interval*60000);
    }
  }
  const candidates = slots.slice(0, 24);
  const quietest = candidates.filter(s=>s.load < maxPerSlot).sort((a,b)=>a.load-b.load)[0];
  return candidates.map(s => ({ ...s, recommended: quietest && s.date===quietest.date && s.time===quietest.time }));
}

function fallbackAnswer(question){
  const q = question.toLowerCase();
  const phone = state.settings?.support_phone || '03014022888';
  if (/hour|open|close|time.*open/.test(q)) return `We're open from ${state.settings?.open_time||'07:00'} to ${state.settings?.close_time||'19:00'} daily.`;
  if (/phone|contact|number|whatsapp|call/.test(q)) return `You can reach us at ${phone}.`;
  if (/menu|drink|have|price|cost|rs\b/.test(q)) {
    const lines = state.products.filter(p=>p.is_available).map(p=>`${p.name} — ${money(p.base_price)}`);
    return `Here's what we have:\n${lines.join('\n')}`;
  }
  if (/point|loyalty|reward|gift/.test(q)) return `You earn 1 point for every Rs ${Math.round(1/(state.settings?.loyalty_points_per_currency||0.1))} spent, credited once your payment is confirmed. Check the Rewards tab for gifts you can unlock!`;
  if (/pickup|order|how.*work/.test(q)) return `Browse the menu, add items to your cart, pick a pickup time, and pay in person when you collect your order.`;
  return `I'm not sure about that one — for anything specific, message us directly at ${phone}.`;
}

function handleChatSubmit(e){
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || state.chatBusy) return false;
  input.value = ''; delete _typed['chat-input'];
  sendChatMessage(text);
  return false;
}
async function sendChatMessage(text){
  state.chatMessages.push({ role: 'user', content: text });
  state.chatBusy = true;
  render();
  scrollChatToBottom();
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/ai-chat`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${state.session.access_token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: state.chatMessages.map(m => ({ role: m.role, content: m.content })) }),
    });
    const json = await parseJsonSafe(resp);
    if (json?.not_configured) {
      state.chatConfigured = false;
      state.chatMessages.push({ role: 'assistant', content: fallbackAnswer(text) });
    } else if (json?.reply) {
      state.chatConfigured = true;
      state.chatMessages.push({ role: 'assistant', content: json.reply });
    } else {
      state.chatMessages.push({ role: 'assistant', content: fallbackAnswer(text) });
    }
  } catch (e) {
    state.chatMessages.push({ role: 'assistant', content: fallbackAnswer(text) });
  }
  state.chatBusy = false;
  render();
  scrollChatToBottom();
}
function scrollChatToBottom(){ setTimeout(() => { const el = document.getElementById('chat-scroll'); if (el) el.scrollTop = el.scrollHeight; }, 30); }

function computeTasteProfile(){
  const counts = {}; let hot = 0, cold = 0;
  state.orders.forEach(o => (o.order_items||[]).forEach(oi => {
    counts[oi.product_name] = (counts[oi.product_name]||0) + oi.quantity;
    const prod = state.products.find(p => p.name === oi.product_name);
    if (prod?.is_iced) cold += oi.quantity; else if (prod?.is_hot) hot += oi.quantity;
  }));
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (!sorted.length) return null;
  const total = hot + cold;
  return { favorite: sorted[0][0], favoriteCount: sorted[0][1], hotPct: total?Math.round(hot/total*100):50, coldPct: total?Math.round(cold/total*100):50 };
}

function orderUrgencyMinutes(o){
  if (!o.pickup_date || !o.pickup_time) return 999;
  const target = new Date(`${o.pickup_date}T${o.pickup_time}`);
  return Math.round((target - new Date()) / 60000);
}
function sortByUrgency(orders){
  return [...orders].sort((a,b) => orderUrgencyMinutes(a) - orderUrgencyMinutes(b));
}

function canCancel(o){
  const role = state.profile?.role;
  return (role === 'admin' || role === 'worker') && o && o.status !== 'completed' && o.status !== 'cancelled';
}
async function cancelOrder(id){
  const o = state.workerOrders.find(x => x.id === id);
  if (!confirm(`Cancel order #${o?.order_number || ''}? The customer will be notified${o?.payment_confirmed ? ' and any points from this order will be taken back' : ''}.`)) return;
  const reasonRaw = prompt('Reason for cancelling (optional, shown to the customer):', '');
  if (reasonRaw === null) return;
  const reason = reasonRaw.trim().slice(0, 200);
  // Optimistic: fade the card out and drop it from active lists right away.
  const prev = o ? { status: o.status, cancel_reason: o.cancel_reason } : null;
  document.querySelectorAll(`[data-order-id="${id}"]`).forEach(el => el.classList.add('fade-out'));
  if (o) { o.status = 'cancelled'; o.cancel_reason = reason || null; }
  if (state.orderDetailId === id) state.orderDetailId = null;
  setTimeout(() => render(), 220);
  const { error } = await sb.from('orders').update({ status: 'cancelled', cancel_reason: reason || null }).eq('id', id);
  if (error) {
    if (o && prev) Object.assign(o, prev);
    showToast(error.message, 'err'); render(); return;
  }

// ================= FILTER INSIGHTS =================
function renderAdminInsights(){
  const orders = state.workerOrders.filter(o=>o.payment_confirmed);
  if (!orders.length) return `<div class="card" style="padding:24px;text-align:center;color:var(--coffee-500)">Insights will appear here once you have a few paid orders.</div>`;

  const avgOrder = orders.reduce((s,o)=>s+Number(o.total),0) / orders.length;
  const byDay = {};
  const byHour = Array(24).fill(0);
  const byCustomer = {};
  orders.forEach(o => {
    const d = new Date(o.created_at);
    const day = d.toLocaleDateString([], { weekday: 'long' });
    byDay[day] = (byDay[day]||0) + Number(o.total);
    byHour[d.getHours()] += 1;
    const cust = o.customer_id;
    byCustomer[cust] = (byCustomer[cust]||0) + 1;
  });
  const bestDay = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  const worstDay = Object.entries(byDay).sort((a,b)=>a[1]-b[1])[0];
  const peakHourIdx = byHour.indexOf(Math.max(...byHour));
  const quietHourIdx = byHour.findIndex((v,i) => v === Math.min(...byHour.filter((x,j)=>byHour[j]>0 || true)) );
  const repeatCustomers = Object.values(byCustomer).filter(c=>c>1).length;
  const totalCustomers = Object.keys(byCustomer).length;
  const repeatRate = totalCustomers ? Math.round(repeatCustomers/totalCustomers*100) : 0;

  const productCounts = {};
  orders.forEach(o => (o.order_items||[]).forEach(oi => productCounts[oi.product_name] = (productCounts[oi.product_name]||0) + oi.quantity));
  const topProducts = Object.entries(productCounts).sort((a,b)=>b[1]-a[1]);
  const slowProduct = topProducts[topProducts.length-1];

  const recommendations = [];
  if (worstDay && bestDay && worstDay[0] !== bestDay[0]) recommendations.push(`${worstDay[0]}s are your slowest — consider a small promo or drop that day to even out demand.`);
  if (topProducts[0]) recommendations.push(`${topProducts[0][0]} is your best seller — feature it prominently or bundle it with slower items.`);
  if (slowProduct && topProducts.length > 3) recommendations.push(`${slowProduct[0]} sells the least — consider a limited-time discount to move it, or retire it.`);
  if (repeatRate < 30 && totalCustomers >= 5) recommendations.push(`Only ${repeatRate}% of customers have ordered more than once — a loyalty mission or gift milestone could help bring them back.`);
  if (peakHourIdx >= 0) recommendations.push(`Your busiest hour is around ${peakHourIdx}:00 — make sure pickup slots have enough capacity then.`);

  const hr=new Date().getHours(); const greet = hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  return `
    <div style="margin:4px 0 16px"><div class="meta">${new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}</div><div class="display" style="font-size:24px;margin-top:2px">${greet}, ${esc((state.profile?.full_name||'').split(' ')[0]||'there')}</div></div>
    <div class="stat-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      ${statCard('Avg Order Value', money(avgOrder))}
      ${statCard('Repeat Customer Rate', repeatRate+'%')}
      ${statCard('Best Day', bestDay?bestDay[0]:'—')}
      ${statCard('Peak Hour', peakHourIdx>=0?peakHourIdx+':00':'—')}
    </div>
    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="margin:0 0 12px;font-size:14px">Orders by Hour</h3>
      <div style="display:flex;align-items:flex-end;gap:2px;height:70px">
        ${byHour.map((v,i)=>`<div style="flex:1;background:${i===peakHourIdx?'var(--caramel-dark)':'var(--caramel-light)'};border-radius:2px 2px 0 0;height:${v?Math.max(4,v/Math.max(...byHour)*60):2}px" title="${i}:00 — ${v} orders"></div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--coffee-500);margin-top:4px"><span>12am</span><span>12pm</span><span>11pm</span></div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="margin:0 0 10px;font-size:14px">💡 Recommendations</h3>
      ${recommendations.length ? recommendations.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--coffee-700)">${esc(r)}</div>`).join('') : `<div style="font-size:13px;color:var(--coffee-500)">Not enough data yet for recommendations.</div>`}
    </div>`;
}

async function uploadProductImage(file){
  const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg';
  const path = `products/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const resp = await doFetch(`${SUPABASE_URL}/storage/v1/object/product-images/${path}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${state.session.access_token}`, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'true' },
    body: file,
  });
  if (!resp.ok) { const j = await parseJsonSafe(resp); throw new Error((j && (j.message || j.error)) || 'Upload failed'); }
  return `${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`;
}
async function handleProductImageChange(input){
  const file = input.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Please choose an image file', 'err'); return; }
  if (file.size > 8 * 1024 * 1024) { showToast('Image must be under 8MB', 'err'); return; }
  const spinner = document.getElementById('pe-upload-spinner');
  const wrap = document.getElementById('pe-img-preview-wrap');
  if (spinner) spinner.style.display = 'flex';
  try {
    const url = await uploadProductImage(file);
    document.getElementById('pe-img').value = url;
    state.adminEditProduct.image_url = url;
    if (wrap) { wrap.style.background = `url('${url}') center/cover`; wrap.querySelector('span')?.remove(); }
    showToast('Photo uploaded', 'ok');
  } catch (e) { showToast('Upload failed: ' + e.message, 'err'); }
  finally { if (spinner) spinner.style.display = 'none'; }
}
function clearProductImage(){
  document.getElementById('pe-img').value = ''; delete _typed['pe-img'];
  state.adminEditProduct.image_url = '';
  const wrap = document.getElementById('pe-img-preview-wrap');
  if (wrap) { wrap.style.background = 'linear-gradient(135deg,#EFE0C4,var(--caramel-light))'; if (!wrap.querySelector('span')) wrap.insertAdjacentHTML('afterbegin', `<span style="font-size:32px;opacity:.6">📷</span>`); }
}

    sb.from('profiles').select('*').eq('id', id).maybeSingle(),
    sb.from('orders').select('*, order_items(*, order_item_options(*))').eq('customer_id', id).order('created_at', { ascending: false }),
    sb.from('favorites').select('product_id').eq('customer_id', id),
    sb.from('reviews').select('*').eq('customer_id', id).order('created_at', { ascending: false }),
    sb.rpc('admin_get_user_email', { p_user_id: id }),
    sb.from('push_subscriptions').select('id').eq('user_id', id),
  ]);
  if (!state.customerProfile || state.customerProfile.id !== id) return;
  if (!pr.data) { showToast(pr.error?.message || 'Could not load this profile', 'err'); setState({ customerProfile: null }); return; }
  setState({ customerProfile: { id, loading: false, profile: pr.data, orders: ords.data || [], favorites: (favs.data || []).map(f => f.product_id), reviews: revs.data || [], email: typeof email.data === 'string' ? email.data : '', pushOn: (push.data || []).length > 0 } });
}
function renderCustomerProfileSheet(fresh){
  const c = state.customerProfile;
  const close = `<button class="btn btn-ghost btn-sm" aria-label="Close" onclick="setState({customerProfile:null})">✕</button>`;
  if (c.loading) return `<div class="scrim" onclick="if(event.target===this) setState({customerProfile:null})"><div class="sheet ${fresh?'':'no-anim'}"><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="display" style="margin:0;font-size:22px">Customer</h2>${close}</div><div style="display:flex;justify-content:center;padding:32px"><div class="spinner"></div></div></div></div>`;
  const u = c.profile, paid = c.orders.filter(o => o.payment_confirmed && o.status !== 'cancelled');
  const spent = paid.reduce((t, o) => t + Number(o.total || 0), 0);
  const counts = {}; c.orders.forEach(o => (o.order_items || []).forEach(oi => { counts[oi.product_name] = (counts[oi.product_name] || 0) + oi.quantity; }));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const favNames = c.favorites.map(id => state.products.find(p => p.id === id)?.name).filter(Boolean);
  const prodName = id => state.products.find(p => p.id === id)?.name || 'Item';
  const kv = (k, v) => `<div class="kv"><span class="meta" style="font-size:13px">${k}</span><span style="text-align:right;min-width:0;overflow-wrap:anywhere">${v}</span></div>`;
  return `<div class="scrim" onclick="if(event.target===this) setState({customerProfile:null})"><div class="sheet ${fresh?'':'no-anim'}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div style="min-width:0"><h2 class="display" style="margin:0;font-size:22px">${esc(u.full_name || '(no name)')}</h2>
        <div class="meta">${esc(memberTier(u.paid_orders_count || 0))} · ${u.role}</div></div>${close}
    </div>
    <div class="stat-row">
      <div class="stat"><b>${u.loyalty_points || 0}</b><span class="meta">points</span></div>
      <div class="stat"><b>${c.orders.length}</b><span class="meta">orders</span></div>
      <div class="stat"><b>${money(spent)}</b><span class="meta">spent (paid)</span></div>
    </div>
    <div class="card" style="padding:0 16px">
      ${kv('Phone', u.phone ? `<a href="tel:${esc(u.phone)}" style="color:inherit">${esc(u.phone)}</a>` : '—')}
      ${kv('Email', c.email ? esc(c.email) : '—')}
      ${kv('Joined', u.created_at ? new Date(u.created_at).toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }) : '—')}
      ${kv('Paid orders', u.paid_orders_count || 0)}
      ${kv('Push notifications', c.pushOn ? 'On' : 'Off')}
      ${kv('Promo / loyalty messages', `${u.notify_promos === false ? 'Off' : 'On'} / ${u.notify_loyalty === false ? 'Off' : 'On'}`)}
    </div>
    <div class="sec-title">Favourite items</div>
    <div class="meta" style="font-size:13px">${favNames.length ? favNames.map(esc).join(', ') : 'None saved'}${top.length ? `<br>Most ordered: ${top.map(([n, q]) => `${esc(n)} ×${q}`).join(', ')}` : ''}</div>
    <div class="sec-title">Recent orders</div>
    ${c.orders.length ? `<div class="card" style="padding:0 16px">${c.orders.slice(0, 10).map(o => `<button class="user-main kv" style="width:100%;display:flex" onclick="setState({orderDetailId:'${o.id}'})">
      <span><b>#${o.order_number}</b> <span class="meta">${new Date(o.created_at).toLocaleDateString([], { month: 'short', day: 'numeric' })} · ${o.status}${o.payment_confirmed ? ' · paid' : ''}</span></span><span>${money(o.total)} ›</span></button>`).join('')}</div>` : '<div class="meta">No orders yet</div>'}
    <div class="sec-title">Reviews</div>
    ${c.reviews.length ? c.reviews.slice(0, 5).map(r => `<div style="margin-bottom:8px;font-size:13px"><b>${esc(prodName(r.product_id))}</b> <span style="color:var(--caramel-dark)">${'★'.repeat(Math.max(0, Math.min(5, r.rating || 0)))}</span>${r.comment ? `<div class="meta">${esc(r.comment)}</div>` : ''}</div>`).join('') : '<div class="meta">No reviews yet</div>'}
    ${u.role !== 'admin' && u.id !== state.session.user.id ? `<div style="margin-top:24px;padding-top:8px;border-top:1px solid rgba(230,217,194,.6)"><button class="link-danger" onclick="deleteUserAccount('${u.id}')">Delete account</button></div>` : ''}
  </div></div>`;
}
async function loadAdminUsers(){
  const { data } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  _adminUsers = data || [];
  renderAdminUsersList();
}
function renderAdminUsersList(){
  const el = document.getElementById('admin-users-list');
  if (!el) return;
  const q = (state.adminUserSearch || '').toLowerCase().trim();
  const list = _adminUsers.filter(u => !q || (u.full_name||'').toLowerCase().includes(q) || (u.phone||'').includes(q));
  el.innerHTML = list.length ? `<div class="card user-list">` + list.map(u=>`<div class="user-row">
    <button class="user-main" onclick="openCustomerProfile('${u.id}')">
      <div class="user-name">${esc(u.full_name||'(no name)')}${u.id===state.session.user.id?' <span class="meta">(you)</span>':''}</div>
      <div class="meta">${u.phone?esc(u.phone)+' · ':''}${u.loyalty_points} pts · view profile ›</div>
    </button>
    ${u.role !== 'admin' && u.id !== state.session.user.id ? `<button class="link-danger" style="font-size:12px;padding:0 4px" aria-label="Delete account" title="Delete account" onclick="deleteUserAccount('${u.id}')">Delete</button>` : ''}
    <select class="input role-select" onchange="changeUserRole('${u.id}', this.value)" ${u.id===state.session.user.id?'disabled title="You cannot change your own role"':''}>
      <option value="customer" ${u.role==='customer'?'selected':''}>Customer</option>
      <option value="worker" ${u.role==='worker'?'selected':''}>Worker</option>
      <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
    </select>
  </div>`).join('') + `</div>` : '<div class="empty">No accounts match.</div>';
}
async function deleteUserAccount(id){
  const u = _adminUsers.find(x => x.id === id) || (state.customerProfile?.id === id ? state.customerProfile.profile : null);
  if (!u) return;
  const typed = prompt(`Permanently delete ${u.full_name || 'this account'} (${u.role})?\n\nTheir login, favorites, points and notifications will be removed. Past orders stay in your sales history as "Deleted customer". This cannot be undone.\n\nType DELETE to confirm:`);
  if (typed === null) return;
  if (typed.trim() !== 'DELETE') { showToast('Not deleted — you must type DELETE', 'err'); return; }
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/delete-user`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${state.session.access_token}`, 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: id }),
    });
    const json = await parseJsonSafe(resp);
    if (!resp.ok || !json?.success) { showToast(json?.error || 'Could not delete account', 'err'); return; }
    showToast(`${u.full_name || 'Account'} deleted`, 'ok');
    state.customerProfile = null;
    await loadAdminUsers();
    await loadWorkerOrders(); render();
  } catch (e) { showToast('Network error: ' + e.message, 'err'); }
}
async function changeUserRole(id, role){ await sb.from('profiles').update({ role }).eq('id', id); showToast('Role updated', 'ok'); }

function renderAdminSettings(){
  // Settings form reads from an isolated draft, NOT from state.settings directly.
  // state.settings gets silently refreshed by background polling every few
  // seconds (customers need that to see your changes) — but this draft is only
  // ever created once per visit to this tab and never auto-overwritten, so a
  // background refresh can never erase something you're in the middle of typing.
  if (!state.settingsDraft) state.settingsDraft = { ...(state.settings || {}) };
  const s = state.settingsDraft;
  setTimeout(async () => { await loadStaffCodes(); const el = document.getElementById('staff-codes-body'); if (el) el.outerHTML = staffCodesBodyHtml(); }, 0);
  setTimeout(async () => { await loadPayoutDetails(); const el = document.getElementById('payout-body'); if (el) el.outerHTML = payoutDetailsBodyHtml(); }, 0);
  return `<div class="card" style="padding:16px;margin-bottom:16px">
    <label class="small">Business Name</label><input class="input" id="s-name" value="${esc(s.business_name||'')}" oninput="state.settingsDraft.business_name=this.value" style="margin:6px 0 12px">
    <label class="small">Tagline</label><input class="input" id="s-tag" value="${esc(s.tagline||'')}" oninput="state.settingsDraft.tagline=this.value" style="margin:6px 0 12px">
    <label class="small">Contact / WhatsApp Number</label><input class="input" id="s-phone" value="${esc(s.support_phone||'')}" oninput="state.settingsDraft.support_phone=this.value" style="margin:6px 0 12px">
    <label class="small">Support Email</label><input class="input" id="s-email" name="support_email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(s.support_email||'')}" oninput="state.settingsDraft.support_email=this.value" onchange="state.settingsDraft.support_email=this.value" style="margin:6px 0 12px">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label class="small">Open Time</label><input class="input" id="s-open" type="time" value="${s.open_time||'07:00'}" onchange="state.settingsDraft.open_time=this.value" style="margin:6px 0 12px"></div>
      <div style="flex:1"><label class="small">Close Time</label><input class="input" id="s-close" type="time" value="${s.close_time||'19:00'}" onchange="state.settingsDraft.close_time=this.value" style="margin:6px 0 12px"></div>
    </div>
    <label class="small">Tax Rate (e.g. 0.05 = 5%)</label><input class="input" id="s-tax" type="number" step="0.001" value="${s.tax_rate||0}" oninput="state.settingsDraft.tax_rate=this.value" style="margin:6px 0 12px">
    <label class="small">Loyalty Points per Rs 1 Spent</label><input class="input" id="s-lpp" type="number" step="0.01" value="${s.loyalty_points_per_currency||0.1}" oninput="state.settingsDraft.loyalty_points_per_currency=this.value" style="margin:6px 0 12px">
    <label class="small">Banner Text</label><input class="input" id="s-banner" value="${esc(s.banner_text||'')}" oninput="state.settingsDraft.banner_text=this.value" style="margin:6px 0 12px">
    <label style="font-size:13px"><input type="checkbox" id="s-banner-active" ${s.banner_active?'checked':''} onchange="state.settingsDraft.banner_active=this.checked"> Show banner</label>
    <label style="font-size:13px;display:block;margin-top:8px"><input type="checkbox" id="s-accepting" ${s.is_accepting_orders?'checked':''} onchange="state.settingsDraft.is_accepting_orders=this.checked"> Currently accepting orders</label>
    <button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="saveSettings()">Save Settings</button>
  </div>
  <div id="payout-body">${payoutDetailsBodyHtml()}</div>
  <div id="staff-codes-body" style="margin-top:16px">${staffCodesBodyHtml()}</div>`;
}
async function loadPayoutDetails(){
  const { data } = await sb.from('payout_details').select('*').maybeSingle();
  state.payoutDetails = data || {};
  if (!state.payoutDraft) state.payoutDraft = { ...state.payoutDetails };
}
function payoutDetailsBodyHtml(){
  // Same draft-isolation pattern as Settings above — bank details are never
  // auto-overwritten mid-edit by a background refresh.
  if (!state.payoutDraft) state.payoutDraft = { ...(state.payoutDetails || {}) };
  const b = state.payoutDraft;
  return `<div class="card" style="padding:16px">
    <h3 style="margin:0 0 4px;font-size:15px">🏦 Bank / Payout Details</h3>
    <p style="font-size:12.5px;color:var(--coffee-500);margin:0 0 14px">Kept private to you and your staff unless you choose to show it to customers — useful if someone wants to pay by bank transfer before pickup.</p>
    <label class="small">Bank Name</label><input class="input" id="pd-bank" value="${esc(b.bank_name||'')}" oninput="state.payoutDraft.bank_name=this.value" style="margin:6px 0 12px">
    <label class="small">Account Title</label><input class="input" id="pd-title" value="${esc(b.account_title||'')}" oninput="state.payoutDraft.account_title=this.value" style="margin:6px 0 12px">
    <label class="small">Account Number</label><input class="input" id="pd-number" value="${esc(b.account_number||'')}" oninput="state.payoutDraft.account_number=this.value" style="margin:6px 0 12px">
    <label class="small">IBAN (optional)</label><input class="input" id="pd-iban" value="${esc(b.iban||'')}" oninput="state.payoutDraft.iban=this.value" style="margin:6px 0 12px">
    <label class="small">Notes (optional)</label><input class="input" id="pd-notes" value="${esc(b.notes||'')}" oninput="state.payoutDraft.notes=this.value" placeholder="e.g. send payment screenshot on WhatsApp" style="margin:6px 0 12px">
    <label style="font-size:13px;display:block;margin-bottom:12px"><input type="checkbox" id="pd-show" ${b.show_to_customers?'checked':''} onchange="state.payoutDraft.show_to_customers=this.checked"> Show these details to signed-in customers at checkout</label>
    <button class="btn btn-primary" style="width:100%" onclick="savePayoutDetails()">Save Bank Details</button>
  </div>`;
}
async function savePayoutDetails(){
  const d = state.payoutDraft || {};
  const payload = {
    bank_name: (d.bank_name||'').trim(),
    account_title: (d.account_title||'').trim(),
    account_number: (d.account_number||'').trim(),
    iban: (d.iban||'').trim(),
    notes: (d.notes||'').trim(),
    show_to_customers: !!d.show_to_customers,
  };
  const { error } = await sb.from('payout_details').update(payload).eq('id', true);
  if (error) { showToast(error.message, 'err'); return; }
  showToast('Bank details saved', 'ok');
  await loadPayoutDetails();
  state.payoutDraft = { ...state.payoutDetails };
}
async function loadStaffCodes(){
  const { data } = await sb.from('app_config').select('*').in('key', ['admin_signup_code','worker_signup_code']);
  state.staffCodes = Object.fromEntries((data||[]).map(r=>[r.key, r.value]));
}
function staffCodesBodyHtml(){
  const codes = state.staffCodes || {};
  const workerOn = !!(codes.worker_signup_code && codes.worker_signup_code.trim());
  return `<div class="card" style="padding:16px">
    <h3 style="margin:0 0 4px;font-size:15px">🔑 Staff Access Codes</h3>
    <p style="font-size:12.5px;color:var(--coffee-500);margin:0 0 16px">Anyone with a code can create their own login at Staff Sign In → Register with a Staff Code. Set any value you like, and change it anytime — the old code stops working immediately.</p>

    <div style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <label class="small">Admin Origin Code</label>
        <span style="font-size:11px;font-weight:700;color:var(--sage)">● ACTIVE</span>
      </div>
      <p style="font-size:11.5px;color:var(--coffee-500);margin:0 0 8px">Your master code — keep this private, it grants full owner access.</p>
      <div style="display:flex;gap:8px">
        <input class="input" id="code-admin" value="${esc(codes.admin_signup_code||'')}" placeholder="Set an admin code">
        <button class="btn btn-outline" style="padding:10px 12px" onclick="copyCode('code-admin')">⧉</button>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="saveStaffCode('admin_signup_code','code-admin')">Save Admin Code</button>
    </div>

    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <label class="small">Worker Code</label>
        <span style="font-size:11px;font-weight:700;color:${workerOn?'var(--sage)':'var(--coffee-500)'}">${workerOn?'● ACTIVE':'○ NOT SET'}</span>
      </div>
      <p style="font-size:11.5px;color:var(--coffee-500);margin:0 0 8px">${workerOn?'Workers can self-register with this code right now.':'Empty — worker self-registration is off until you set one.'}</p>
      <div style="display:flex;gap:8px">
        <input class="input" id="code-worker" value="${esc(codes.worker_signup_code||'')}" placeholder="Leave blank to disable">
        <button class="btn btn-outline" style="padding:10px 12px" onclick="copyCode('code-worker')">⧉</button>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="saveStaffCode('worker_signup_code','code-worker')">Save Worker Code</button>
    </div>
  </div>`;
}
function copyCode(inputId){
  const el = document.getElementById(inputId);
  if (!el || !el.value) { showToast('Nothing to copy yet', 'err'); return; }
  navigator.clipboard?.writeText(el.value).then(() => showToast('Copied', 'ok')).catch(() => showToast('Could not copy', 'err'));
}
async function saveStaffCode(key, inputId){
  const value = document.getElementById(inputId).value.trim();
  const { error } = await sb.from('app_config').update({ value }).eq('key', key);
  if (error) { showToast(error.message, 'err'); return; }
  await loadStaffCodes();
  const el = document.getElementById('staff-codes-body'); if (el) el.outerHTML = staffCodesBodyHtml();
  showToast(value ? 'Code saved' : 'Code cleared — registration disabled', 'ok');
}
async function saveSettings(){
  // Save exactly what is on screen. The draft is only updated by input
  // events, and autofill / keyboard suggestions / paste on some phones fill
  // a field without firing one. The draft then still held the old value,
  // so "Save" wrote the old email back. The visible fields win.
  const d = Object.assign({}, state.settingsDraft || {});
  const fieldMap = { 's-name':'business_name', 's-tag':'tagline', 's-phone':'support_phone', 's-email':'support_email', 's-open':'open_time', 's-close':'close_time', 's-tax':'tax_rate', 's-lpp':'loyalty_points_per_currency', 's-banner':'banner_text' };
  Object.entries(fieldMap).forEach(([id, key]) => { const el = document.getElementById(id); if (el) d[key] = el.value; });
  const ba = document.getElementById('s-banner-active'); if (ba) d.banner_active = ba.checked;
  const ac = document.getElementById('s-accepting'); if (ac) d.is_accepting_orders = ac.checked;
  d.support_email = String(d.support_email || '').trim();
  if (d.support_email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.support_email)) { showToast('Please enter a valid email address', 'err'); return; }
  const payload = {
    business_name: d.business_name || '',
    tagline: d.tagline || '',
    support_phone: d.support_phone || '',
    support_email: d.support_email || '',
    open_time: d.open_time || '07:00',
    close_time: d.close_time || '19:00',
    tax_rate: Number(d.tax_rate) || 0,
    loyalty_points_per_currency: Number(d.loyalty_points_per_currency) || 1,
    banner_text: d.banner_text || '',
    banner_active: !!d.banner_active,
    is_accepting_orders: !!d.is_accepting_orders,
  };
  const { data: saved, error } = await sb.from('business_settings').update(payload).eq('id', true);
  if (error) { showToast(error.message, 'err'); return; }
  const row = Array.isArray(saved) ? saved[0] : saved;
  if (row && (row.support_email || '') !== payload.support_email) { showToast('Email did not save — please try again', 'err'); return; }
  await refreshSettings();
  state.settingsDraft = { ...state.settings };
  forgetTyped('s-');
  showToast('Settings saved','ok'); render();
}

init();
</script>
</body>
