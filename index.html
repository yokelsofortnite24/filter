<title>Filter — Coffee & Tea</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --cream:#F6F0E4; --cream-2:#FBF7EF; --card:#FFFDF9;
  --coffee-900:#2A180F; --coffee-700:#4A3020; --coffee-500:#6B4A34;
  --caramel:#B5713D; --caramel-dark:#8F5629; --caramel-light:#E3B583;
  --sage:#77875F; --line:#E6D9C2; --danger:#B34B3C; --shadow:0 10px 30px -12px rgba(42,24,15,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--coffee-900);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Fraunces',serif}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--caramel-light)}
.scrim{position:fixed;inset:0;background:rgba(42,24,15,.45);backdrop-filter:blur(2px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--cream-2);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:24px;box-shadow:var(--shadow);animation:up .28s ease}
@media(min-width:640px){.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet.no-anim{animation:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--coffee-900);color:var(--cream-2)}
.btn-primary:hover{background:var(--caramel-dark)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1.5px solid var(--coffee-900);color:var(--coffee-900)}
.btn-ghost{background:var(--line);color:var(--coffee-700)}
.btn-danger{background:var(--danger);color:#fff}
.input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px;color:var(--coffee-900)}
.input:focus{outline:none;border-color:var(--caramel)}
.chip{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--coffee-700);white-space:nowrap}
.chip.active{background:var(--coffee-900);color:var(--cream-2);border-color:var(--coffee-900)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.badge.pending{background:#EDE0C8;color:#8F5629}
.badge.accepted{background:#DCE6D2;color:#4C6B3B}
.badge.preparing{background:#F3D9B1;color:#8F5629}
.badge.ready{background:#CFE7DC;color:#2E6E52}
.badge.completed{background:#D9D2C4;color:#4A3020}
.badge.cancelled{background:#EFD3CD;color:#B34B3C}
.spinner{width:18px;height:18px;border:2.5px solid var(--caramel-light);border-top-color:var(--caramel-dark);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabbar{position:sticky;bottom:0;background:var(--cream-2);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:30}
.tabbtn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--coffee-500);font-size:10px;font-weight:700;padding:4px 10px;border-radius:12px}
.tabbtn.active{color:var(--caramel-dark)}
.topbar{position:sticky;top:0;background:rgba(246,240,228,.92);backdrop-filter:blur(8px);z-index:20;padding:16px 18px;border-bottom:1px solid var(--line)}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.scrollx::-webkit-scrollbar{display:none}
.fade-in{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--coffee-900);color:var(--cream-2);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:100;box-shadow:var(--shadow);animation:fadein .2s ease}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--coffee-900);color:var(--cream-2)}
.progress-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--caramel),var(--caramel-dark));transition:width .5s ease}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.link{color:var(--caramel-dark);font-weight:600;text-decoration:underline;cursor:pointer;background:none;border:none;font-size:inherit;font-family:inherit}
label.small{font-size:12px;font-weight:700;color:var(--coffee-500);text-transform:uppercase;letter-spacing:.04em}
.btn{transition:.16s cubic-bezier(.4,0,.2,1)}
.btn:active{transform:scale(.96)}
.card{transition:box-shadow .2s ease, transform .2s ease}
@media(hover:hover){.card.hoverable:hover{transform:translateY(-2px);box-shadow:0 16px 34px -14px rgba(42,24,15,.26)}}
.topbar{transition:box-shadow .2s}
#loadbar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--caramel),var(--caramel-dark));z-index:200;transition:width .3s ease,opacity .3s ease;box-shadow:0 0 8px var(--caramel)}
.toast-stack{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}

/* ---- v20 refresh + motion ---- */
:root{--soft:0 1px 2px rgba(42,24,15,.04),0 8px 24px -18px rgba(74,48,32,.30)}
.card{border-color:rgba(230,217,194,.65);box-shadow:var(--soft);border-radius:18px}
.btn{transition:transform .16s cubic-bezier(.3,.7,.4,1.4),background-color .2s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.pcard{transition:transform .2s ease,box-shadow .2s ease}
.pcard:active{transform:scale(.98)}
.cart-badge.bump{animation:bump .5s cubic-bezier(.3,.7,.4,1.6)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.45)}70%{transform:scale(.9)}100%{transform:scale(1)}}
#root.enter > :not(.scrim):not(.toast-stack):not(.tabbar){animation:screenIn .32s ease-out both}
#root.enter .pcard{animation:cardIn .42s ease-out both}
#root.enter .pcard:nth-child(2){animation-delay:.04s}#root.enter .pcard:nth-child(3){animation-delay:.08s}#root.enter .pcard:nth-child(4){animation-delay:.12s}#root.enter .pcard:nth-child(5){animation-delay:.16s}#root.enter .pcard:nth-child(6){animation-delay:.2s}#root.enter .pcard:nth-child(n+7){animation-delay:.24s}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.sheet:not(.no-anim){animation-timing-function:cubic-bezier(.2,.8,.2,1)!important}
.scrim{animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.success-pop{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(42,24,15,.18);animation:fadeIn .2s ease-out;transition:opacity .35s;pointer-events:none}
.success-pop.out{opacity:0}
.sp-card{background:var(--card);border-radius:24px;padding:24px 28px;text-align:center;box-shadow:0 20px 50px -20px rgba(42,24,15,.45);animation:popIn .45s cubic-bezier(.3,.7,.4,1.4) both}
.sp-check svg{width:64px;height:64px;fill:none;stroke:var(--sage);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.sp-check circle{stroke-dasharray:151;stroke-dashoffset:151;animation:draw .5s .1s ease-out forwards;stroke:rgba(119,135,95,.35)}
.sp-check path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .35s .45s ease-out forwards}
.sp-text{margin-top:10px;font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--coffee-900)}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}

.fly-dot{position:fixed;z-index:300;width:44px;height:44px;border-radius:50%;background:var(--caramel) center/cover no-repeat;box-shadow:0 8px 20px rgba(42,24,15,.35);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:none}

.burst{position:fixed;left:50%;top:45%;z-index:160;pointer-events:none}
.burst i{position:absolute;left:0;top:0;animation:burstFly 1.3s cubic-bezier(.15,.7,.3,1) forwards;opacity:0}
.burst .bean{width:12px;height:16px;border-radius:50%;background:#5A3826;box-shadow:inset -2px 0 0 #3A2216}

@keyframes burstFly{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.6)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 140px)) rotate(var(--r)) scale(1)}}

@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* tracker */
.tracker{position:relative;display:flex;justify-content:space-between;padding-top:2px;margin-top:12px}
.tr-line{position:absolute;left:10%;right:10%;top:13px;height:4px;border-radius:4px;background:rgba(119,90,60,.15)}

.tr-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--caramel),var(--caramel-dark));transition:width .9s cubic-bezier(.3,.8,.3,1)}

.tr-step{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,140,80,.55)}70%{box-shadow:0 0 0 12px rgba(200,140,80,0)}100%{box-shadow:0 0 0 0 rgba(200,140,80,0)}}
.tr-lbl{font-size:10.5px;font-weight:600;color:var(--coffee-500);text-align:center;line-height:1.2}

/* loader */

.cup-handle{position:absolute;bottom:12px;left:46px;width:16px;height:18px;border:5px solid var(--coffee-900);border-left:0;border-radius:0 12px 12px 0;animation:cupBob 1.6s ease-in-out infinite}

@keyframes steam{0%{opacity:0;transform:translateY(6px) scaleY(.6)}40%{opacity:.7}100%{opacity:0;transform:translateY(-16px) scaleY(1.1)}}
@keyframes cupBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.skel{background:linear-gradient(90deg,#EFE6D6 25%,#F8F2E8 50%,#EFE6D6 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:12px}

// ---- session persistence (this app runs on its own real domain now, so
// normal browser storage is safe and is how "stay signed in" actually works) ----
const SESSION_STORAGE_KEY = 'filter_auth_session';
function saveSessionToStorage(session){
  try { localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session)); } catch (e) { /* storage unavailable — session just won't persist */ }
}
function loadSessionFromStorage(){
  try { const raw = localStorage.getItem(SESSION_STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function clearSessionFromStorage(){
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) { /* ignore */ }
}

// ---- session refresh (keeps the user signed in) ----
let _refreshTimer = null;
function scheduleRefresh(session){
  clearTimeout(_refreshTimer); try { rtUpdateToken(); } catch (e) {}
  if (!session?.refresh_token || !session?.expires_in) return;
  const ms = Math.max((session.expires_in - 90) * 1000, 15000);
  _refreshTimer = setTimeout(refreshSession, ms);
}
async function refreshSession(){
  if (!state.session?.refresh_token) return false;
  try {
    const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ refresh_token: state.session.refresh_token }) });
    const json = await parseJsonSafe(resp);
    if (!resp.ok || !json?.access_token) { clearSessionFromStorage(); return false; }
    state.session = json;
    saveSessionToStorage(json);
    scheduleRefresh(json);
    return true;
  } catch (e) { return false; }
}
async function doFetch(url, opts){
  const bg = _bgDepth > 0;
  beginRequest(bg);
  try {
    let resp = await fetch(url, opts);
    if (resp.status === 401 && state.session?.refresh_token) {
      const ok = await refreshSession();
      if (ok) {
        opts.headers = Object.assign({}, opts.headers, { 'Authorization': `Bearer ${state.session.access_token}` });
        resp = await fetch(url, opts);
      }
    }
    return resp;
  } finally { endRequest(bg); }
}

function fromTable(table){
  const q = { selectCols: '*', filters: [], orderCol: null, orderAsc: true, limitN: null, method: 'GET', body: null, single: null };
  const builder = {
    select(cols){ q.selectCols = cols || '*'; return builder; },
    eq(col, val){ q.filters.push(`${col}=eq.${encodeURIComponent(val)}`); return builder; },
    gte(col, val){ q.filters.push(`${col}=gte.${encodeURIComponent(val)}`); return builder; },
    lte(col, val){ q.filters.push(`${col}=lte.${encodeURIComponent(val)}`); return builder; },
    in(col, vals){ q.filters.push(`${col}=in.(${(vals||[]).map(v=>encodeURIComponent('"'+String(v).replace(/"/g,'\\"')+'"')).join(',')})`); return builder; },
    order(col, opts){ q.orderCol = col; q.orderAsc = !(opts && opts.ascending === false); return builder; },
    limit(n){ q.limitN = n; return builder; },
    insert(payload){ q.method = 'POST'; q.body = payload; return builder; },
    update(payload){ q.method = 'PATCH'; q.body = payload; return builder; },
    delete(){ q.method = 'DELETE'; return builder; },
    maybeSingle(){ q.single = 'maybe'; return exec(); },
    single(){ q.single = true; return exec(); },
    then(resolve, reject){ return exec().then(resolve, reject); },
  };
  async function exec(){
    let url = `${SUPABASE_URL}/rest/v1/${table}?select=${encodeURIComponent(q.selectCols)}`;
    if (q.filters.length) url += '&' + q.filters.join('&');
    if (q.orderCol) url += `&order=${q.orderCol}.${q.orderAsc ? 'asc' : 'desc'}`;
    if (q.limitN) url += `&limit=${q.limitN}`;
    const headers = authHeaders(q.method !== 'GET' ? { 'Prefer': 'return=representation' } : {});
    let resp;
    try {
      resp = await doFetch(url, { method: q.method, headers, cache: 'no-store', body: q.body !== null ? JSON.stringify(q.body) : undefined });
    } catch (e) { return { data: null, error: { message: 'Network error: ' + e.message } }; }
    const json = await parseJsonSafe(resp);
    if (!resp.ok) return { data: null, error: { message: (json && (json.message || json.error_description || json.msg || json.hint)) || resp.statusText || 'Request failed' } };
    // An UPDATE that RLS blocks returns 200 with zero rows — that used to look
    // like a successful save even though nothing changed for customers.
    if (q.method === 'PATCH' && Array.isArray(json) && json.length === 0) return { data: null, error: { message: "Not saved — your account doesn't have permission to change this (check that you're signed in as admin)." } };
    if (q.single === true) return { data: Array.isArray(json) ? json[0] : json, error: null };
    if (q.single === 'maybe') return { data: Array.isArray(json) ? (json[0] || null) : json, error: null };
    return { data: json, error: null };
  }
  return builder;
}
async function rpcCall(fn, params){
  try {
    const resp = await doFetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', cache: 'no-store', headers: authHeaders(), body: JSON.stringify(params || {}) });
    const json = await parseJsonSafe(resp);
    if (!resp.ok) return { data: null, error: { message: (json && (json.message || json.hint || json.error_description)) || resp.statusText || 'Request failed' } };
    return { data: json, error: null };
  } catch (e) { return { data: null, error: { message: 'Network error: ' + e.message } }; }
}

// Tiny Supabase Realtime client (Phoenix websocket). Any change to orders /
// my notifications triggers an immediate refresh; polling stays as fallback.
const RT = { ws: null, ref: 0, hb: null, joined: false, retry: 1000, timer: null, topic: null, wantUid: null };
function rtStart(){
  if (!state.session || !('WebSocket' in window)) return;
  const uid = state.session.user.id;
  if (RT.ws && RT.wantUid === uid && RT.ws.readyState <= 1) return;
  rtStop(); RT.wantUid = uid;
  const url = SUPABASE_URL.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(SUPABASE_KEY) + '&vsn=1.0.0';
  let ws; try { ws = new WebSocket(url); } catch (e) { return rtRetry(); }
  RT.ws = ws;
  const staff = ['admin','worker'].includes(state.profile?.role);
  const changes = [
    staff ? { event: '*', schema: 'public', table: 'orders' } : { event: '*', schema: 'public', table: 'orders', filter: 'customer_id=eq.' + uid },
    { event: 'INSERT', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + uid },
    staff ? { event: 'INSERT', schema: 'public', table: 'order_events' } : { event: 'INSERT', schema: 'public', table: 'order_events', filter: 'customer_id=eq.' + uid },
  ];
  RT.topic = 'realtime:filter-' + uid.slice(0, 8);
  ws.onopen = () => {
    RT.retry = 1000;
    rtSend(RT.topic, 'phx_join', { config: { broadcast: { self: false }, presence: { key: '' }, postgres_changes: changes }, access_token: state.session.access_token });
    clearInterval(RT.hb); RT.hb = setInterval(() => rtSend('phoenix', 'heartbeat', {}), 25000);
  };
  ws.onmessage = (ev) => {

      // already-open customer session without them needing to reload.
      // Menu/settings change rarely: refresh them every 3rd tick (or on realtime

      _pollN++;

      if (state.profile.role === 'customer') {
        const prevStatus = Object.fromEntries(state.orders.map(o => [o.id, o.status]));
        const prevPoints = state.profile.loyalty_points;
        const prevGiftCount = (state.myGifts||[]).length;
        await loadOrders();
        const statusChanges = state.orders.filter(o => prevStatus[o.id] && prevStatus[o.id] !== o.status);
        await Promise.all([loadNotifications(), loadMyGifts()]);
        const { data: freshProfile } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
        let pointsGained = 0;
        if (freshProfile) {
          if (prevPoints != null && freshProfile.loyalty_points > prevPoints) pointsGained = freshProfile.loyalty_points - prevPoints;

        }
        const giftUnlocked = (state.myGifts||[]).length > prevGiftCount;

        if (isEditingSomething()) return; // data is fresh in state; screen updates next safe render

// ---------------- ORDER PLACEMENT ----------------
async function placeOrder({ pickupDate, pickupTime, notes }){
  const subtotal = cartSubtotal();
  const taxRate = Number(state.settings?.tax_rate || 0);
  let discount = 0, promoId = null;
  if (state.promoResult) { discount += Number(state.promoResult.calculated_discount); promoId = state.promoResult.promo_id; }
  const loyaltyDiscount = state.redeemPoints * Number(state.settings?.loyalty_point_value || 0.01);
  discount += loyaltyDiscount;
  const taxable = Math.max(subtotal - discount, 0);
  const tax = +(taxable * taxRate).toFixed(2);
  const payM = availablePayMethods().includes(state.payMethod) ? state.payMethod : 'cash';
  const fee = feeFor(taxable + tax, payM);
  const total = +(taxable + tax + fee).toFixed(2);
  const pointsEarned = Math.floor((taxable + tax) * Number(state.settings?.loyalty_points_per_currency || 1));

  const { data: order, error } = await sb.from('orders').insert({
    customer_id: state.session.user.id, status: 'pending', fulfillment_type: 'pickup',
    subtotal, discount_amount: +discount.toFixed(2),
    tax_amount: tax, total, loyalty_points_redeemed: state.redeemPoints, loyalty_discount_amount: +loyaltyDiscount.toFixed(2),
    loyalty_points_earned: pointsEarned, promo_id: promoId, special_instructions: notes, payment_method: payM, payment_fee: fee, tip: tipAmt(),
  }).select().single();
  if (error) { showToast('Order failed: ' + error.message, 'err'); return null; }

  let itemsFailed = false;
  for (const item of state.cart) {
    const { data: oi, error: oiErr } = await sb.from('order_items').insert({
      order_id: order.id, product_id: item.product_id, product_name: item.name, size_name: item.size_name,
      size_price_modifier: item.size_mod, unit_price: item.unit_price, quantity: item.qty,
      line_total: cartLineTotal(item), special_instructions: item.notes,
    }).select().single();
    if (oiErr) { itemsFailed = true; showToast('Some items failed to save: ' + oiErr.message, 'err'); continue; }
    if (item.choices.length) {
      const { error: optErr } = await sb.from('order_item_options').insert(item.choices.map(c => ({ order_item_id: oi.id, choice_name: c.name, price_modifier: c.price_modifier })));
      if (optErr) itemsFailed = true;
    }
  }
  if (itemsFailed) showToast(`Order #${order.order_number} was created but some details didn't save — please tell staff or call ${state.settings?.support_phone || ''}`, 'err');
  if (state.redeemPoints > 0) await sb.rpc('redeem_points_for_order', { p_order_id: order.id, p_points: state.redeemPoints });
  if (promoId) await sb.rpc('record_promo_redemption', { p_order_id: order.id, p_promo_id: promoId });

  await loadProfile();
  setState({ cart: [], checkoutOpen: false, promoCode: '', promoResult: null, redeemPoints: 0, tip: 0, tipCustom: false, view: 'customer', tab: 'orders' });
  burst(); successPop(`Order #${order.order_number} placed!`);
  return order;
}

// ---- Admin: peak-hours heatmap ----
function heatmapHtml(){
  if (!_an) { loadAnalytics(); return `<div class="card" style="padding:16px;margin-bottom:16px"><div class="skel" style="height:140px"></div></div>`; }
  const H0 = 8, H1 = 23, grid = Array.from({ length: 7 }, () => Array(H1 - H0 + 1).fill(0));
  const since = Date.now() - 28 * 864e5; let n = 0;
  _an.forEach(o => { if (o.status === 'cancelled' || o.excluded_from_sales) return; const d = new Date(o.created_at); if (d < since) return; const h = d.getHours(); if (h < H0 || h > H1) return; grid[(d.getDay() + 6) % 7][h - H0]++; n++; });
  const max = Math.max(1, ...grid.flat()); const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  let best = [0, 0, 0]; grid.forEach((r, i) => r.forEach((v, j) => { if (v > best[0]) best = [v, i, j]; }));
  const hl = h => { const x = h % 12 || 12; return x + (h < 12 ? 'a' : 'p'); };
  return `<div class="card" style="padding:16px;margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="display" style="font-size:17px">Busy hours</div><span class="meta">last 4 weeks · ${n} orders</span></div>
    <div class="heat" style="grid-template-columns:30px repeat(${H1 - H0 + 1},1fr)"><span></span>${Array.from({ length: H1 - H0 + 1 }, (_, j) => `<span class="hh">${(j + H0) % 3 === 0 ? hl(j + H0) : ''}</span>`).join('')}
    ${grid.map((r, i) => `<span class="hd">${days[i]}</span>` + r.map((v, j) => `<span class="hc" title="${days[i]} ${hl(j + H0)}: ${v}" style="background:${v ? `rgba(181,113,61,${(.15 + .85 * v / max).toFixed(2)})` : 'var(--line)'}"></span>`).join('')).join('')}</div>
    <div class="meta" style="margin-top:8px">${best[0] ? `Busiest: <b>${days[best[1]]} around ${hl(best[2] + H0)}</b> — plan stock and help for then.` : 'Not enough orders yet.'}</div></div>`;
}

function captureScrolls(){
  const out = { win: [window.scrollX, window.scrollY], els: {} };
  root.querySelectorAll('*').forEach(el => { if (el.scrollLeft || el.scrollTop) out.els[_domKey(el)] = [el.scrollLeft, el.scrollTop]; });
  return out;
}
function restoreScrolls(s){
  Object.entries(s.els).forEach(([k, [x, y]]) => {
    const el = k[0] === '#' ? document.getElementById(k.slice(1)) : _byKey(k);
    if (el) { el.scrollLeft = x; el.scrollTop = y; }
  });
  if (window.scrollX !== s.win[0] || window.scrollY !== s.win[1]) window.scrollTo(s.win[0], s.win[1]);
}
function _byKey(k){
  let el = root;
  for (const part of k.split('/')) { const [i, tag] = part.split(':'); el = el && el.children[Number(i)]; if (!el || el.tagName !== tag) return null; }
  return el;
}
// ---- Form protection: ANY re-render (polling, toasts, button taps) used to
// rebuild inputs from state and wipe what the person had typed. We remember
// every value the person types (by element id) and put it back after each
// render. An entry is forgotten as soon as its field leaves the screen
// (form saved/closed, tab changed), so fresh data shows next time.
const _typed = {};
function _rememberTyped(e){
  const el = e.target;
  if (!el || !el.id || !root.contains(el)) return;
  if (!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.type === 'file') return;
  _typed[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? { checked: el.checked } : { value: el.value };
}
document.addEventListener('input', _rememberTyped, true);
document.addEventListener('change', _rememberTyped, true);
function forgetTyped(prefix){ Object.keys(_typed).forEach(k => { if (!prefix || k.startsWith(prefix)) delete _typed[k]; }); }
function restoreTypedValues(activeId, selStart, selEnd){
  Object.keys(_typed).forEach(id => {
    const el = document.getElementById(id);
    if (!el) { delete _typed[id]; return; }
    const v = _typed[id];
    if ('checked' in v) el.checked = v.checked; else if (el.value !== v.value) el.value = v.value;
  });
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && document.activeElement !== el) {
      try { el.focus({ preventScroll: true }); if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch (e) {}
    }
  }
}

async function registerStaffWithCode(){
  const full_name = document.getElementById('sr-name').value.trim();
  const email = document.getElementById('sr-email').value.trim();
  const password = document.getElementById('sr-pass').value;
  const role = document.getElementById('sr-role').value;
  const code = document.getElementById('sr-code').value.trim();
  if (!full_name || !email || !password || !code) { state.authError = 'Please fill in every field'; return render(); }
  if (password.length < 6) { state.authError = 'Password must be at least 6 characters'; return render(); }
  state.authBusy = true; state.authError = ''; render();
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/register-staff-with-code`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, full_name, role, code }),
    });
    const json = await parseJsonSafe(resp);
    state.authBusy = false;
    if (!resp.ok) { state.authError = json?.error || 'Could not create account'; return render(); }
    showToast('Account created — sign in below', 'ok');
    setState({ authMode: 'staff' });
  } catch (e) { state.authBusy = false; state.authError = 'Network error: ' + e.message; render(); }
}
function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('af-email').value.trim();
  const pass = document.getElementById('af-pass').value;
  state._afEmail = email;
  if (state.authMode === 'signup') { const name = document.getElementById('af-name').value.trim(); state._afName = name; signUp(email, pass, name); }
  else signIn(email, pass);
  return false;
}

async function markAllNotificationsRead(){
  const unread = state.notifications.filter(n=>!n.is_read);
  if (!unread.length) return;
  state.notifications.forEach(n=>n.is_read=true); render();
  await Promise.all(unread.map(n=>sb.from('notifications').update({ is_read: true }).eq('id', n.id)));
}

function productEmoji(p){
  const tags = (p.tags||[]).join(' ').toLowerCase();
  const name = (p.name||'').toLowerCase();
  if (tags.includes('tea') || name.includes('tea') || name.includes('chai')) return p.is_iced ? '🧊' : '🍵';
  if (tags.includes('chocolate') || name.includes('chocolate')) return '🍫';
  if (tags.includes('bakery')) return '🥐';
  if (p.is_iced) return '🧊';
  return '☕';
}
function filteredProducts(){
  return applySort(state.products).filter(p=>{
    if (state.activeCategory!=='all' && p.category_id!==state.activeCategory) return false;
    if (state.search && !p.name.toLowerCase().includes(state.search.toLowerCase()) && !(p.description||'').toLowerCase().includes(state.search.toLowerCase())) return false;
    if (state.filters.hot && !p.is_hot) return false;
    if (state.filters.iced && !p.is_iced) return false;
    return true;
  });
}
// ---- v11 helpers: shop status, live order, order again, share ----
function fmtTime12(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'pm':'am'; const hh=((h+11)%12)+1; return m?`${hh}:${String(m).padStart(2,'0')}${ap}`:`${hh}${ap}`; }
function shopStatus(){
  const st=state.settings||{}; const o=(st.open_time||'07:00').slice(0,5), c=(st.close_time||'19:00').slice(0,5);
  const d=new Date(); const now=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const hours=`${fmtTime12(o)} – ${fmtTime12(c)}`;
  if (st.is_accepting_orders===false) return {open:false, text:'Not taking orders right now', hours};
  if (pausedUntil()) return {open:false, text:`Short break · back at ${fmtClock(pausedUntil())}`, hours};
  const inHours = o<=c ? (now>=o && now<c) : (now>=o || now<c);
  if (inHours) return {open:true, text:`Open now · until ${fmtTime12(c)}`, hours};
  return {open:false, text:`Closed · opens ${fmtTime12(o)}`, hours};
}
function renderShopStatus(){
  const s=shopStatus();
  return `<div class="shop-status ${s.open?'open':'closed'}"><span class="dot"></span><b>${s.text}</b><span class="meta" style="margin-left:auto;white-space:nowrap">Today ${s.hours}</span></div>`;
}
function liveOrder(){ const cut=Date.now()-18*3600000; return (state.orders||[]).find(o=>['pending','accepted','preparing','ready'].includes(o.status) && new Date(o.created_at).getTime()>cut); }

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div class="lo-kicker">Order #${o.order_number}</div><div class="lo-title">${t}</div><div class="lo-sub">${sub}</div></div><div style="font-size:28px">${o.status==='ready'?'🛎️':'☕'}</div></div>
    ${renderTracker(o, true)}
    ${etaLine(o,'lo-eta')}

function renderRatePrompt(){
  if (!state._myRevLoaded && !state._myRevLoading && state.session){ state._myRevLoading=true; sb.from('reviews').select('order_id').eq('customer_id',state.session.user.id).then(({data})=>{ state.myReviewOrders=(data||[]).map(x=>x.order_id); state._myRevLoaded=true; if(state.tab==='menu') render(); }); }
  if (!state._myRevLoaded) return '';
  let dismissed=[]; try{ dismissed=JSON.parse(localStorage.getItem('filter_rate_dismissed')||'[]'); }catch(e){}
  const o=(state.orders||[]).find(x=>x.status==='completed' && Date.now()-new Date(x.completed_at||x.created_at).getTime()<3*86400000 && !state.myReviewOrders.includes(x.id) && !dismissed.includes(x.id) && (x.order_items||[]).some(i=>i.product_id));
  if(!o) return '';
  const it=o.order_items.find(i=>i.product_id);
  return `<div class="card rate-card"><div style="flex:1;min-width:0"><div class="lo-kicker" style="color:var(--caramel-dark);opacity:1">How was it?</div><div style="font-weight:700;font-size:15px">Rate your ${esc(it.product_name)}</div><div class="stars">${[1,2,3,4,5].map(n=>`<button aria-label="${n} stars" onclick="openReviewModal('${it.product_id}','${esc(it.product_name).replace(/'/g,'&#39;')}','${o.id}'); state.reviewModal.rating=${n}; render()">★</button>`).join('')}</div></div><button class="btn btn-ghost btn-sm" aria-label="Dismiss" onclick="dismissRate('${o.id}')">✕</button></div>`;

function dismissRate(id){ let d=[]; try{ d=JSON.parse(localStorage.getItem('filter_rate_dismissed')||'[]'); }catch(e){} d.push(id); localStorage.setItem('filter_rate_dismissed', JSON.stringify(d.slice(-50))); render(); }
function renderOrderAgain(){
  if (liveOrder()) return '';
  const o=(state.orders||[]).find(x=>x.status==='completed' && (x.order_items||[]).length); if(!o) return '';
  const items=o.order_items.map(i=>`${i.quantity}× ${i.product_name}`).join(', ');
  return `<div class="card order-again"><div style="flex:1;min-width:0"><div class="lo-kicker" style="color:var(--caramel-dark);opacity:1">Order again</div><div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(items)}</div><div class="meta">${money(o.total)} · last on ${new Date(o.created_at).toLocaleDateString([],{day:'numeric',month:'short'})}</div></div><button class="btn btn-primary btn-sm" onclick="reorder('${o.id}')">Add to cart</button></div>`;
}
function orderSummaryText(o){
  const lines=(o.order_items||[]).map(i=>`• ${i.quantity}× ${i.product_name}${i.size_name?' ('+i.size_name+')':''} — ${money(i.line_total ?? i.unit_price*i.quantity)}`);
  return `${state.settings?.business_name||'Filter'} — Order #${o.order_number}\n${o.profiles?.full_name?'For: '+o.profiles.full_name+'\n':''}Pickup: ${o.pickup_time?(o.pickup_date||'')+' '+fmtTime12(o.pickup_time.slice(0,5)):'ASAP'}\n\n${lines.join('\n')}\n\nTotal: ${money(o.total)} (${o.payment_confirmed?'paid':'payment pending'} · ${PAY_LABELS[o.payment_method||'cash']||'Cash at pickup'})\nStatus: ${o.status}${o.special_instructions?'\nNotes: '+o.special_instructions:''}`;
}
function waNumber(ph){ let d=String(ph||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('0092')) d=d.slice(2); if(d.startsWith('0')) d='92'+d.slice(1); else if(d.length===10 && d.startsWith('3')) d='92'+d; return d; }
function shopWa(){ const n = waNumber(state.settings?.support_phone); return /^92\d{10}$/.test(n) ? n : ''; }
function openShopWhatsApp(order){
  const n = shopWa(); if (!n) return;
  const msg = order ? `Hi ${state.settings?.business_name||'Filter'}, about my order #${order.order_number}: ` : `Hi ${state.settings?.business_name||'Filter'}! `;

  else state.productModal.choices[groupId] = cur.includes(choiceId) ? cur.filter(x=>x!==choiceId) : (cur.length<max ? [...cur, choiceId] : cur);

}

function checkoutSummaryHtml(){
  const subtotal = cartSubtotal();
  const loyaltyValue = Number(state.settings?.loyalty_point_value || 0.01);
  const loyaltyDiscount = state.redeemPoints*loyaltyValue;
  const promoDiscount = state.promoResult?Number(state.promoResult.calculated_discount):0;
  const discount = promoDiscount+loyaltyDiscount;
  const taxable = Math.max(subtotal-discount,0);
  const tax = taxable * Number(state.settings?.tax_rate||0);
  const total = taxable+tax+feeFor(taxable+tax);
  return `<div class="card" style="padding:14px;font-size:13.5px">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Subtotal</span><span>${money(subtotal)}</span></div>
    ${discount>0?`<div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--sage)"><span>Discount</span><span>−${money(discount)}</span></div>`:''}
    ${tax>0?`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Tax</span><span>${money(tax)}</span></div>`:''}
    <div class="fee-line">${feeRowHtml(taxable+tax)}</div>
    ${tipAmt()>0?`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Tip</span><span>${money(tipAmt())}</span></div>`:''}
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding-top:8px;border-top:1px solid var(--line)"><span>Total</span><span>${money(total+tipAmt())}</span></div>
  </div>`;
}
async function applyPromo(){
  const code = document.getElementById('promo-input').value.trim();
  if (!code) return;
  const { data, error } = await sb.rpc('validate_promo', { p_code: code, p_subtotal: cartSubtotal() });
  if (error) { showToast(error.message.replace(/^.*?: /,'')); return; }
  state.promoCode = code; state.promoResult = data[0];
  showToast('Promo applied!');
  render();
}
async function submitOrder(){
  const btn = document.getElementById('place-order-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = `<div class="spinner"></div>`; }
  const notes = document.getElementById('order-notes').value.trim();
  const nameEl = document.getElementById('checkout-name');
  if (nameEl) {
    const nm = nameEl.value.trim();
    if (nm.length < 2) { showToast('Please enter your name', 'err'); nameEl.focus(); if (btn) { btn.disabled = false; btn.textContent = 'Place Order'; } return; }
    const { error: ne } = await sb.from('profiles').update({ full_name: nm }).eq('id', state.session.user.id);
    if (ne) { showToast('Could not save your name: ' + ne.message, 'err'); if (btn) { btn.disabled = false; btn.textContent = 'Place Order'; } return; }
    state.profile.full_name = nm;
  }
  const slotVal = [new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Karachi' }), null];
  if (pausedUntil() && state.profile?.role === 'customer') { showToast(`We're on a short break — ordering opens again at ${fmtClock(pausedUntil())}.`, 'err'); if (btn) { btn.disabled = false; btn.textContent = 'Place Order'; } return; }
  if (state.settings && state.settings.is_accepting_orders === false) { showToast("Sorry, we're not taking orders right now.", 'err'); if (btn) { btn.disabled = false; btn.textContent = 'Place Order'; } return; }
  let order = null;
  try { order = await placeOrder({ pickupDate: slotVal[0], pickupTime: slotVal[1], notes }); }
  catch (e) { showToast('Order failed: ' + (e.message || e), 'err'); }
  if (!order) { const b = document.getElementById('place-order-btn'); if (b) { b.disabled = false; b.textContent = 'Place Order — try again'; } }
}

function fallbackAnswer(question){
  const q = question.toLowerCase();
  const phone = state.settings?.support_phone || '03014022888';
  if (/hour|open|close|time.*open/.test(q)) return `We're open from ${state.settings?.open_time||'07:00'} to ${state.settings?.close_time||'19:00'} daily.`;
  if (/phone|contact|number|whatsapp|call/.test(q)) return `You can reach us at ${phone}.`;
  if (/menu|drink|have|price|cost|rs\b/.test(q)) {
    const lines = state.products.filter(p=>p.is_available).map(p=>`${p.name} — ${money(p.base_price)}`);
    return `Here's what we have:\n${lines.join('\n')}`;
  }
  if (/point|loyalty|reward|gift/.test(q)) return `You earn 1 point for every Rs ${Math.round(1/(state.settings?.loyalty_points_per_currency||0.1))} spent, credited once your payment is confirmed. Check the Rewards tab for gifts you can unlock!`;
  if (/pickup|order|how.*work/.test(q)) return `Browse the menu, add items to your cart, pick a pickup time, and pay in person when you collect your order.`;
  return `I'm not sure about that one — for anything specific, message us directly at ${phone}.`;
}

      ${state.chatMessages.map(m=>`<div style="align-self:${m.role==='user'?'flex-end':'flex-start'};max-width:82%;background:${m.role==='user'?'var(--coffee-900)':'var(--card)'};color:${m.role==='user'?'var(--cream-2)':'var(--coffee-900)'};border:${m.role==='user'?'none':'1px solid var(--line)'};padding:10px 13px;border-radius:16px;font-size:13.5px;white-space:pre-wrap">${esc(m.content)}</div>`).join('')}
      ${state.chatBusy ? `<div style="align-self:flex-start;padding:10px 13px"><div class="spinner"></div></div>` : ''}
    </div>
    <form onsubmit="return handleChatSubmit(event)" style="display:flex;gap:8px">
      <input class="input" id="chat-input" placeholder="Ask about the menu, hours..." autocomplete="off" ${state.chatBusy?'disabled':''}>
      <button class="btn btn-primary" type="submit" style="padding:12px 16px" ${state.chatBusy?'disabled':''}>➤</button>
    </form>
  </div></div>`;
}
function handleChatSubmit(e){
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || state.chatBusy) return false;
  input.value = ''; delete _typed['chat-input'];
  sendChatMessage(text);
  return false;
}
async function sendChatMessage(text){
  state.chatMessages.push({ role: 'user', content: text });
  state.chatBusy = true;
  render();
  scrollChatToBottom();
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/ai-chat`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${state.session.access_token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: state.chatMessages.map(m => ({ role: m.role, content: m.content })) }),
    });
    const json = await parseJsonSafe(resp);
    if (json?.not_configured) {
      state.chatConfigured = false;
      state.chatMessages.push({ role: 'assistant', content: fallbackAnswer(text) });
    } else if (json?.reply) {
      state.chatConfigured = true;
      state.chatMessages.push({ role: 'assistant', content: json.reply });
    } else {
      state.chatMessages.push({ role: 'assistant', content: fallbackAnswer(text) });
    }
  } catch (e) {
    state.chatMessages.push({ role: 'assistant', content: fallbackAnswer(text) });
  }
  state.chatBusy = false;
  render();
  scrollChatToBottom();
}
function scrollChatToBottom(){ setTimeout(() => { const el = document.getElementById('chat-scroll'); if (el) el.scrollTop = el.scrollHeight; }, 30); }

function computeTasteProfile(){
  const counts = {}; let hot = 0, cold = 0;
  state.orders.forEach(o => (o.order_items||[]).forEach(oi => {
    counts[oi.product_name] = (counts[oi.product_name]||0) + oi.quantity;
    const prod = state.products.find(p => p.name === oi.product_name);
    if (prod?.is_iced) cold += oi.quantity; else if (prod?.is_hot) hot += oi.quantity;
  }));
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (!sorted.length) return null;
  const total = hot + cold;
  return { favorite: sorted[0][0], favoriteCount: sorted[0][1], hotPct: total?Math.round(hot/total*100):50, coldPct: total?Math.round(cold/total*100):50 };
}

function canCancel(o){
  const role = state.profile?.role;

}
async function cancelOrder(id){
  const o = state.workerOrders.find(x => x.id === id);
  if (!confirm(`Cancel order #${o?.order_number || ''}? The customer will be notified${o?.payment_confirmed ? ' and any points from this order will be taken back' : ''}.`)) return;
  const reasonRaw = prompt('Reason for cancelling (optional, shown to the customer):', '');
  if (reasonRaw === null) return;
  const reason = reasonRaw.trim().slice(0, 200);
  // Optimistic: fade the card out and drop it from active lists right away.
  const prev = o ? { status: o.status, cancel_reason: o.cancel_reason } : null;
  document.querySelectorAll(`[data-order-id="${id}"]`).forEach(el => el.classList.add('fade-out'));
  if (o) { o.status = 'cancelled'; o.cancel_reason = reason || null; }
  if (state.orderDetailId === id) state.orderDetailId = null;
  setTimeout(() => render(), 220);
  const { error } = await sb.from('orders').update({ status: 'cancelled', cancel_reason: reason || null }).eq('id', id);
  if (error) {
    if (o && prev) Object.assign(o, prev);
    showToast(error.message, 'err'); render(); return;
  }
  showToast(`Order #${o?.order_number || ''} cancelled`, 'ok');
  await loadWorkerOrders(); render();
}
async function updateOrderStatus(id, status){
  if (status === 'accepted' && state.profile?.role === 'admin') { const o = findAnyOrder(id); if (o && o.status === 'pending') { if (!document.querySelector(`[data-order-id="${id}"]`) || state.quickActionsId || state.notifPanelOpen) state.orderDetailId = id; state.notifPanelOpen = false; startPickupPanel(id, false); return; } }
  const { error } = await sb.from('orders').update({ status, assigned_worker_id: state.session.user.id }).eq('id', id);
  if (error) return showToast(error.message);
  await loadWorkerOrders(); render();
}

function renderAdminInsights(){
  return heatmapHtml() + renderAdminInsightsBody();

function renderAdminInsightsBody(){
  const orders = state.workerOrders.filter(o=>o.payment_confirmed && !o.excluded_from_sales);
  if (!orders.length) return `<div class="card" style="padding:24px;text-align:center;color:var(--coffee-500)">Insights will appear here once you have a few paid orders.</div>`;

  const avgOrder = orders.reduce((s,o)=>s+Number(o.total),0) / orders.length;
  const byDay = {};
  const byHour = Array(24).fill(0);
  const byCustomer = {};
  orders.forEach(o => {
    const d = new Date(o.created_at);
    const day = d.toLocaleDateString([], { weekday: 'long' });
    byDay[day] = (byDay[day]||0) + Number(o.total);
    byHour[d.getHours()] += 1;
    const cust = o.customer_id;
    byCustomer[cust] = (byCustomer[cust]||0) + 1;
  });
  const bestDay = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  const worstDay = Object.entries(byDay).sort((a,b)=>a[1]-b[1])[0];
  const peakHourIdx = byHour.indexOf(Math.max(...byHour));
  const quietHourIdx = byHour.findIndex((v,i) => v === Math.min(...byHour.filter((x,j)=>byHour[j]>0 || true)) );
  const repeatCustomers = Object.values(byCustomer).filter(c=>c>1).length;
  const totalCustomers = Object.keys(byCustomer).length;
  const repeatRate = totalCustomers ? Math.round(repeatCustomers/totalCustomers*100) : 0;

  const productCounts = {};
  orders.forEach(o => (o.order_items||[]).forEach(oi => productCounts[oi.product_name] = (productCounts[oi.product_name]||0) + oi.quantity));
  const topProducts = Object.entries(productCounts).sort((a,b)=>b[1]-a[1]);
  const slowProduct = topProducts[topProducts.length-1];

  const recommendations = [];
  if (worstDay && bestDay && worstDay[0] !== bestDay[0]) recommendations.push(`${worstDay[0]}s are your slowest — consider a small promo or drop that day to even out demand.`);
  if (topProducts[0]) recommendations.push(`${topProducts[0][0]} is your best seller — feature it prominently or bundle it with slower items.`);
  if (slowProduct && topProducts.length > 3) recommendations.push(`${slowProduct[0]} sells the least — consider a limited-time discount to move it, or retire it.`);
  if (repeatRate < 30 && totalCustomers >= 5) recommendations.push(`Only ${repeatRate}% of customers have ordered more than once — a loyalty mission or gift milestone could help bring them back.`);
  if (peakHourIdx >= 0) recommendations.push(`Your busiest hour is around ${peakHourIdx}:00 — make sure pickup slots have enough capacity then.`);

  const hr=new Date().getHours(); const greet = hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  return `
    <div style="margin:4px 0 16px"><div class="meta">${new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}</div><div class="display" style="font-size:24px;margin-top:2px">${greet}, ${esc((state.profile?.full_name||'').split(' ')[0]||'there')}</div></div>
    <div class="stat-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      ${statCard('Avg Order Value', money(avgOrder))}
      ${statCard('Repeat Customer Rate', repeatRate+'%')}
      ${statCard('Best Day', bestDay?bestDay[0]:'—')}
      ${statCard('Peak Hour', peakHourIdx>=0?peakHourIdx+':00':'—')}
    </div>
    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="margin:0 0 12px;font-size:14px">Orders by Hour</h3>
      <div style="display:flex;align-items:flex-end;gap:2px;height:70px">
        ${byHour.map((v,i)=>`<div style="flex:1;background:${i===peakHourIdx?'var(--caramel-dark)':'var(--caramel-light)'};border-radius:2px 2px 0 0;height:${v?Math.max(4,v/Math.max(...byHour)*60):2}px" title="${i}:00 — ${v} orders"></div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--coffee-500);margin-top:4px"><span>12am</span><span>12pm</span><span>11pm</span></div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:16px">
      <h3 style="margin:0 0 10px;font-size:14px">💡 Recommendations</h3>
      ${recommendations.length ? recommendations.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--coffee-700)">${esc(r)}</div>`).join('') : `<div style="font-size:13px;color:var(--coffee-500)">Not enough data yet for recommendations.</div>`}
    </div>`;
}

async function uploadProductImage(file){
  const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg';
  const path = `products/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const resp = await doFetch(`${SUPABASE_URL}/storage/v1/object/product-images/${path}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${state.session.access_token}`, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'true' },
    body: file,
  });
  if (!resp.ok) { const j = await parseJsonSafe(resp); throw new Error((j && (j.message || j.error)) || 'Upload failed'); }
  return `${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`;
}
async function handleProductImageChange(input){
  const file = input.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Please choose an image file', 'err'); return; }
  if (file.size > 8 * 1024 * 1024) { showToast('Image must be under 8MB', 'err'); return; }
  const spinner = document.getElementById('pe-upload-spinner');
  const wrap = document.getElementById('pe-img-preview-wrap');
  if (spinner) spinner.style.display = 'flex';
  try {
    const url = await uploadProductImage(file);
    document.getElementById('pe-img').value = url;
    state.adminEditProduct.image_url = url;
    if (wrap) { wrap.style.background = `url('${url}') center/cover`; wrap.querySelector('span')?.remove(); }
    showToast('Photo uploaded', 'ok');
  } catch (e) { showToast('Upload failed: ' + e.message, 'err'); }
  finally { if (spinner) spinner.style.display = 'none'; }
}
function clearProductImage(){
  document.getElementById('pe-img').value = ''; delete _typed['pe-img'];

  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);

async function adjustPointsUI(uid){
  const amt = parseInt(document.getElementById('adj-amt')?.value, 10), reason = (document.getElementById('adj-reason')?.value || '').trim();
  if (!amt || amt < 1) return showToast('Enter a points amount', 'err');
  if (!reason) return showToast('Please add a reason', 'err');
  const delta = state.adjMode === 'remove' ? -amt : amt;
  if (!confirm(`${delta>0?'Add':'Remove'} ${amt} points?\nReason: ${reason}`)) return;
  const { data, error } = await sb.rpc('admin_adjust_points', { p_user_id: uid, p_delta: delta, p_reason: reason });
  if (error) return showToast(error.message, 'err');
  forgetTyped && forgetTyped('adj-amt'); forgetTyped && forgetTyped('adj-reason');
  showToast(`Done — new balance ${data} pts`, 'ok');
  state.adjMode = 'add'; openCustomerProfile(uid);
}

  const typed = prompt(`Permanently delete ${u.full_name || 'this account'} (${u.role})?\n\nTheir login, favorites, points and notifications will be removed. Past orders stay in your sales history as "Deleted customer". This cannot be undone.\n\nType DELETE to confirm:`);

  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/delete-user`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${state.session.access_token}`, 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },

  setTimeout(async () => { await loadPayoutDetails(); const el = document.getElementById('payout-body'); if (el && !el.contains(document.activeElement)) el.innerHTML = payoutDetailsBodyHtml(); }, 0);
  return `<div class="card" style="padding:16px;margin-bottom:16px">
    <label class="small">Business Name</label><input class="input" id="s-name" value="${esc(s.business_name||'')}" oninput="state.settingsDraft.business_name=this.value" style="margin:6px 0 12px">
    <label class="small">Tagline</label><input class="input" id="s-tag" value="${esc(s.tagline||'')}" oninput="state.settingsDraft.tagline=this.value" style="margin:6px 0 12px">
    <label class="small">Contact / WhatsApp Number</label><input class="input" id="s-phone" value="${esc(s.support_phone||'')}" oninput="state.settingsDraft.support_phone=this.value; const h=document.getElementById('wa-hint'); if(h){const n=waNumber(this.value); h.textContent=/^92\d{10}$/.test(n)?'WhatsApp button links to wa.me/'+n:'Enter a Pakistani mobile (e.g. 0301 2345678) to show the WhatsApp button';}" style="margin:6px 0 4px">
    <div class="meta" id="wa-hint" style="margin:0 0 12px">${/^92\d{10}$/.test(waNumber(s.support_phone))?'WhatsApp button links to wa.me/'+waNumber(s.support_phone):'Enter a Pakistani mobile (e.g. 0301 2345678) to show the WhatsApp button'}</div>
    <label class="small">Support Email</label><input class="input" id="s-email" name="support_email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(s.support_email||'')}" oninput="state.settingsDraft.support_email=this.value" onchange="state.settingsDraft.support_email=this.value" style="margin:6px 0 12px">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label class="small">Open Time</label><input class="input" id="s-open" type="time" value="${s.open_time||'07:00'}" onchange="state.settingsDraft.open_time=this.value" style="margin:6px 0 12px"></div>
      <div style="flex:1"><label class="small">Close Time</label><input class="input" id="s-close" type="time" value="${s.close_time||'19:00'}" onchange="state.settingsDraft.close_time=this.value" style="margin:6px 0 12px"></div>
    </div>
    <label class="small">Tax Rate (e.g. 0.05 = 5%)</label><input class="input" id="s-tax" type="number" step="0.001" value="${s.tax_rate||0}" oninput="state.settingsDraft.tax_rate=this.value" style="margin:6px 0 12px">
    <label class="small">Loyalty Points per Rs 1 Spent</label><input class="input" id="s-lpp" type="number" step="0.01" value="${s.loyalty_points_per_currency||0.1}" oninput="state.settingsDraft.loyalty_points_per_currency=this.value" style="margin:6px 0 12px">

    <label style="font-size:13px;display:block;margin-top:8px"><input type="checkbox" id="s-accepting" ${s.is_accepting_orders?'checked':''} onchange="state.settingsDraft.is_accepting_orders=this.checked"> Currently accepting orders</label>
    <button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="saveSettings()">Save Settings</button>
  </div>
  <div id="payout-body">${payoutDetailsBodyHtml()}</div>
  ${qrSettingsHtml()}
  ${feeSettingsHtml()}
  ${announcementEditorHtml()}
  <div id="staff-codes-body" style="margin-top:16px">${staffCodesBodyHtml()}</div>`;
}
async function loadPayoutDetails(){
  const { data, error } = await sb.from('payout_details').select('*').maybeSingle();
  if (error) { state._payoutError = error.message; return; }
  state.payoutDetails = data || {};
  state._payoutLoaded = true; state._payoutError = '';
  // Only seed the form from the DB when the admin hasn't started editing.
  if (!state.payoutDraft || !state._payoutDirty) state.payoutDraft = { ...state.payoutDetails };
}
// ---- Announcement / limited-time drop (v15) — stored on business_settings
// (banner_text = message, banner_active = on/off, announce_* = title, item, end).
function announcementEditorHtml(){
  const s = state.settings || {};
  const ends = s.announce_ends_at ? (() => { const d = new Date(s.announce_ends_at); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16); })() : '';
  return `<div class="card" style="padding:16px;margin-top:16px" id="ann-editor">
    <h3 style="margin:0 0 4px;font-size:15px">📣 Announcement / limited-time drop</h3>
    <p class="meta" style="margin:0 0 12px">Shown as a card at the top of the customer menu. Leave the end time empty to keep it up until you switch it off.</p>
    <label class="small">Title</label><input class="input" id="ann-title" maxlength="60" value="${esc(s.announce_title||'')}" placeholder="e.g. Pistachio Latte is back" style="margin:6px 0 12px">
    <label class="small">Message</label><textarea class="input" id="ann-text" maxlength="240" style="margin:6px 0 12px;min-height:64px" placeholder="e.g. This weekend only — Rs 50 off every iced drink.">${esc(s.banner_text||'')}</textarea>
    <label class="small">Feature an item (optional)</label><select class="input" id="ann-prod" style="margin:6px 0 12px"><option value="">None</option>${state.products.map(p=>`<option value="${p.id}" ${s.announce_product_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <label class="small">Ends at (optional, shows a countdown)</label><input class="input" id="ann-ends" type="datetime-local" value="${ends}" style="margin:6px 0 12px">
    <label style="font-size:14px;display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="ann-on" ${s.banner_active?'checked':''}> Show it to customers</label>
    <div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" style="flex:1.4" onclick="saveAnnouncement(false)">Save</button><button class="btn btn-ghost btn-sm" style="flex:1" onclick="saveAnnouncement(true)">Save & notify customers</button></div>
  </div>`;
}
async function saveAnnouncement(notify){
  const v = id => (document.getElementById(id)?.value || '').trim();
  const endsRaw = v('ann-ends');
  const payload = {
    announce_title: v('ann-title') || null, banner_text: v('ann-text'), announce_product_id: v('ann-prod') || null,
    announce_ends_at: endsRaw ? new Date(endsRaw).toISOString() : null, banner_active: !!document.getElementById('ann-on')?.checked,
  };
  if (payload.banner_active && !payload.banner_text) return showToast('Add a message first', 'err');
  if (payload.announce_ends_at && new Date(payload.announce_ends_at) <= new Date() && payload.banner_active) return showToast('The end time is already in the past', 'err');
  const s = state.settings || {};
  const changed = (s.banner_text||'') !== payload.banner_text || (s.announce_title||null) !== payload.announce_title || (s.announce_product_id||null) !== payload.announce_product_id;
  payload.announce_version = (s.announce_version||0) + (changed ? 1 : 0);
  const { data, error } = await sb.from('business_settings').update(payload).eq('id', true).select();
  if (error || !data?.length) return showToast('Not saved: ' + (error?.message || 'no permission'), 'err');
  Object.assign(state.settings, data[0]); if (state.settingsDraft) Object.assign(state.settingsDraft, { banner_text: data[0].banner_text, banner_active: data[0].banner_active });
  forgetTyped('ann-');
  if (notify) {
    if (!payload.banner_active) { showToast('Saved. Switch it on to notify customers', 'info'); return; }
    const { data: n, error: e2 } = await sb.rpc('admin_notify_announcement');
    if (e2) { showToast('Saved, but not sent: ' + e2.message, 'err'); return; }
    showToast(`Saved and sent to ${n} customer${n===1?'':'s'}`, 'ok'); return;
  }
  showToast('Announcement saved', 'ok');
}
function annKey(s){ return `${s.announce_version||0}|${(s.banner_text||'').length}`; }
function activeAnnouncement(){
  const s = state.settings || {};
  if (!s.banner_active || !(s.banner_text||'').trim()) return null;
  if (s.announce_ends_at && new Date(s.announce_ends_at) <= new Date()) return null;
  try { if (localStorage.getItem('filter_ann_dismissed') === annKey(s)) return null; } catch (e) {}
  return s;
}
function fmtCountdown(ms){ if (ms <= 0) return 'Ending now'; const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000), sec=Math.floor(ms%60000/1000); return d ? `${d}d ${h}h ${m}m left` : h ? `${h}h ${m}m left` : `${m}m ${String(sec).padStart(2,'0')}s left`; }
let _annTimer = null;
function renderAnnouncement(){
  const s = activeAnnouncement();
  clearInterval(_annTimer); _annTimer = null;
  if (!s) return '';
  const p = s.announce_product_id ? state.products.find(x => x.id === s.announce_product_id && x.is_available) : null;
  if (s.announce_ends_at) _annTimer = setInterval(() => {
    const el = document.getElementById('ann-countdown'); const ms = new Date(s.announce_ends_at) - new Date();
    if (ms <= 0) { clearInterval(_annTimer); render(); return; }
    if (el) el.textContent = fmtCountdown(ms); else clearInterval(_annTimer);
  }, 1000);
  return `<div class="ann-card">
    <button class="ann-x" aria-label="Dismiss" onclick="dismissAnnouncement()">✕</button>
    <div class="lo-kicker">${s.announce_ends_at ? '⚡ Limited time' : '📣 From Filter'}</div>
    ${s.announce_title ? `<div class="ann-title">${esc(s.announce_title)}</div>` : ''}
    <div class="ann-text">${esc(s.banner_text)}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap">
      ${s.announce_ends_at ? `<span class="ann-timer" id="ann-countdown">${fmtCountdown(new Date(s.announce_ends_at) - new Date())}</span>` : ''}
      ${p ? `<button class="btn btn-sm ann-btn" onclick="openProduct('${p.id}')">Order ${esc(p.name)} · ${money(p.base_price)}</button>` : ''}
    </div>
  </div>`;
}
function dismissAnnouncement(){ try { localStorage.setItem('filter_ann_dismissed', annKey(state.settings||{})); } catch (e) {} render(); }

function payoutDetailsBodyHtml(){
  // Same draft-isolation pattern as Settings above — bank details are never
  // auto-overwritten mid-edit by a background refresh.
  // Never build the form from an empty placeholder: that is what made saves wipe
  // the other fields and look like nothing was saved.
  if (!state._payoutLoaded) return `<div class="card" style="padding:16px"><h3 style="margin:0 0 4px;font-size:15px">🏦 Bank / Payout Details</h3><div class="meta">${state._payoutError ? 'Could not load: ' + esc(state._payoutError) : 'Loading…'}</div></div>`;
  if (!state.payoutDraft) state.payoutDraft = { ...(state.payoutDetails || {}) };
  const b = state.payoutDraft;
  return `<div class="card" style="padding:16px">
    <h3 style="margin:0 0 4px;font-size:15px">🏦 Bank / Payout Details</h3>
    <p style="font-size:12.5px;color:var(--coffee-500);margin:0 0 14px">Kept private to you and your staff unless you choose to show it to customers — useful if someone wants to pay by bank transfer before pickup.</p>
    <label class="small">Bank Name</label><input class="input" id="pd-bank" value="${esc(b.bank_name||'')}" oninput="state.payoutDraft.bank_name=this.value; state._payoutDirty=true" onchange="state.payoutDraft.bank_name=this.value; state._payoutDirty=true" style="margin:6px 0 12px">
    <label class="small">Account Title</label><input class="input" id="pd-title" value="${esc(b.account_title||'')}" oninput="state.payoutDraft.account_title=this.value; state._payoutDirty=true" onchange="state.payoutDraft.account_title=this.value; state._payoutDirty=true" style="margin:6px 0 12px">
    <label class="small">Account Number</label><input class="input" id="pd-number" value="${esc(b.account_number||'')}" oninput="state.payoutDraft.account_number=this.value; state._payoutDirty=true" onchange="state.payoutDraft.account_number=this.value; state._payoutDirty=true" style="margin:6px 0 12px">
    <label class="small">IBAN (optional)</label><input class="input" id="pd-iban" value="${esc(b.iban||'')}" oninput="state.payoutDraft.iban=this.value; state._payoutDirty=true" onchange="state.payoutDraft.iban=this.value; state._payoutDirty=true" style="margin:6px 0 12px">
    <label class="small">Notes (optional)</label><input class="input" id="pd-notes" value="${esc(b.notes||'')}" oninput="state.payoutDraft.notes=this.value; state._payoutDirty=true" onchange="state.payoutDraft.notes=this.value; state._payoutDirty=true" placeholder="e.g. send payment screenshot on WhatsApp" style="margin:6px 0 12px">
    <label style="font-size:13px;display:block;margin-bottom:12px"><input type="checkbox" id="pd-show" ${b.show_to_customers?'checked':''} onchange="state.payoutDraft.show_to_customers=this.checked; state._payoutDirty=true"> Show these details to signed-in customers at checkout</label>
    <button class="btn btn-primary" style="width:100%" id="pd-save" onclick="savePayoutDetails()">Save Bank Details</button>
  </div>`;
}
async function savePayoutDetails(){
  if (!state._payoutLoaded) { showToast('Still loading your bank details, try again in a moment', 'err'); return; }
  // Read straight from the inputs (covers iOS autofill / paste that fire no input event).
  const val = id => (document.getElementById(id)?.value || '').trim();
  const show = document.getElementById('pd-show');
  const payload = {
    bank_name: val('pd-bank'), account_title: val('pd-title'), account_number: val('pd-number'),
    iban: val('pd-iban'), notes: val('pd-notes'), show_to_customers: !!(show && show.checked),
    updated_at: new Date().toISOString(),
  };
  const btn = document.getElementById('pd-save'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  let { data, error } = await sb.from('payout_details').update(payload).eq('id', true).select();
  if (!error && (!data || !data.length)) ({ data, error } = await sb.from('payout_details').insert({ id: true, ...payload }).select());
  if (btn) { btn.disabled = false; btn.textContent = 'Save Bank Details'; }
  const row = data && data[0];
  if (error || !row) { showToast('Not saved: ' + (error?.message || 'no permission to change bank details'), 'err'); return; }
  if (row.account_number !== payload.account_number || row.account_title !== payload.account_title || row.bank_name !== payload.bank_name || row.show_to_customers !== payload.show_to_customers) { showToast('Not saved — the server kept different values. Please try again.', 'err'); return; }
  state.payoutDetails = row; state.payoutDraft = { ...row }; state._payoutDirty = false;
  forgetTyped('pd-');
  showToast('Bank details saved', 'ok'); render();
}
async function loadStaffCodes(){
  const { data } = await sb.from('app_config').select('*').in('key', ['admin_signup_code','worker_signup_code']);
  state.staffCodes = Object.fromEntries((data||[]).map(r=>[r.key, r.value]));
}
function staffCodesBodyHtml(){
  const codes = state.staffCodes || {};
  const workerOn = !!(codes.worker_signup_code && codes.worker_signup_code.trim());
  return `<div class="card" style="padding:16px">
    <h3 style="margin:0 0 4px;font-size:15px">🔑 Staff Access Codes</h3>
    <p style="font-size:12.5px;color:var(--coffee-500);margin:0 0 16px">Anyone with a code can create their own login at Staff Sign In → Register with a Staff Code. Set any value you like, and change it anytime — the old code stops working immediately.</p>

    <div style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <label class="small">Admin Origin Code</label>
        <span style="font-size:11px;font-weight:700;color:var(--sage)">● ACTIVE</span>
      </div>
      <p style="font-size:11.5px;color:var(--coffee-500);margin:0 0 8px">Your master code — keep this private, it grants full owner access.</p>
      <div style="display:flex;gap:8px">
        <input class="input" id="code-admin" value="${esc(codes.admin_signup_code||'')}" placeholder="Set an admin code">
        <button class="btn btn-outline" style="padding:10px 12px" onclick="copyCode('code-admin')">⧉</button>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="saveStaffCode('admin_signup_code','code-admin')">Save Admin Code</button>
    </div>

    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <label class="small">Worker Code</label>
        <span style="font-size:11px;font-weight:700;color:${workerOn?'var(--sage)':'var(--coffee-500)'}">${workerOn?'● ACTIVE':'○ NOT SET'}</span>
      </div>
      <p style="font-size:11.5px;color:var(--coffee-500);margin:0 0 8px">${workerOn?'Workers can self-register with this code right now.':'Empty — worker self-registration is off until you set one.'}</p>
      <div style="display:flex;gap:8px">
        <input class="input" id="code-worker" value="${esc(codes.worker_signup_code||'')}" placeholder="Leave blank to disable">
        <button class="btn btn-outline" style="padding:10px 12px" onclick="copyCode('code-worker')">⧉</button>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="saveStaffCode('worker_signup_code','code-worker')">Save Worker Code</button>
    </div>
  </div>`;
}
function copyCode(inputId){
  const el = document.getElementById(inputId);
  if (!el || !el.value) { showToast('Nothing to copy yet', 'err'); return; }
  navigator.clipboard?.writeText(el.value).then(() => showToast('Copied', 'ok')).catch(() => showToast('Could not copy', 'err'));
}
async function saveStaffCode(key, inputId){
  const value = document.getElementById(inputId).value.trim();
  const { error } = await sb.from('app_config').update({ value }).eq('key', key);
  if (error) { showToast(error.message, 'err'); return; }
  await loadStaffCodes();
  const el = document.getElementById('staff-codes-body'); if (el) el.outerHTML = staffCodesBodyHtml();
  showToast(value ? 'Code saved' : 'Code cleared — registration disabled', 'ok');
}
async function saveSettings(){
  // Save exactly what is on screen. The draft is only updated by input
  // events, and autofill / keyboard suggestions / paste on some phones fill
  // a field without firing one. The draft then still held the old value,
  // so "Save" wrote the old email back. The visible fields win.
  const d = Object.assign({}, state.settingsDraft || {});
  const fieldMap = { 's-name':'business_name', 's-tag':'tagline', 's-phone':'support_phone', 's-email':'support_email', 's-open':'open_time', 's-close':'close_time', 's-tax':'tax_rate', 's-lpp':'loyalty_points_per_currency' };
  Object.entries(fieldMap).forEach(([id, key]) => { const el = document.getElementById(id); if (el) d[key] = el.value; });
  const ac = document.getElementById('s-accepting'); if (ac) d.is_accepting_orders = ac.checked;
  d.support_email = String(d.support_email || '').trim();
  if (d.support_email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.support_email)) { showToast('Please enter a valid email address', 'err'); return; }
  const payload = {
    business_name: d.business_name || '',
    tagline: d.tagline || '',
    support_phone: d.support_phone || '',
    support_email: d.support_email || '',
    open_time: d.open_time || '07:00',
    close_time: d.close_time || '19:00',
    tax_rate: Number(d.tax_rate) || 0,
    loyalty_points_per_currency: Number(d.loyalty_points_per_currency) || 1,
    is_accepting_orders: !!d.is_accepting_orders,
  };
  const { data: saved, error } = await sb.from('business_settings').update(payload).eq('id', true);
  if (error) { showToast(error.message, 'err'); return; }
  const row = Array.isArray(saved) ? saved[0] : saved;
  if (row && (row.support_email || '') !== payload.support_email) { showToast('Email did not save — please try again', 'err'); return; }
  await refreshSettings();
  state.settingsDraft = { ...state.settings };
  forgetTyped('s-');
  showToast('Settings saved','ok'); render();
}

init();
</script>
</body>
</html>
